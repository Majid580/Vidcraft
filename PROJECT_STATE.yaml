        verified_by: "Claude (Opus 5) — three successful live end-to-end runs driven through the REAL browser UI against the full real stack (real Groq, real RAG-003 index, real Bull/Redis, real MongoDB, real providers, real Remotion, real FFmpeg — no stubs, no demo mode), meeting the roadmap's 'one successful live end-to-end run demonstrated (x3)' criterion and Section 14's 'repeated for both pathways' note. Run 1 Remotion: 3/3 shots, 360 frames = 12s, 122s wall-clock. Run 2 Pollinations: 2 of 4 shots survived real provider 500s, 300 frames = 10s, 200s. Run 3 Cloudflare: 4/4 shots, 480 frames = 16s, 115s. All three produced poster + WebVTT + hardsubbed copy with postprocess_error unset, and every frame count equalled the ASSEMBLED shot durations x 30fps exactly. The UI rendered the poster, a working <track>, and both download links on all three."
        note: "Logged in DEMO_RUNBOOK.md (new, repo root) — pre-flight checklist, a timed ~6-minute demo script, the rehearsal log, known issues with prepared answers, and a mid-demo failure table. Two findings materially change how the demo should be run. (1) THE FIRST STORYBOARD REQUEST AFTER ai-service STARTS TAKES ~2 MINUTES (torch + all-MiniLM-L6-v2 loading on first use) and the Vite proxy gives up before it finishes, returning 502 Bad Gateway — observed live during this rehearsal; the same request took 3.4s once warm. A throwaway warm-up run is now a mandatory pre-flight step. (2) PROVIDER RELIABILITY DIFFERS SHARPLY: Pollinations lost 2 of 4 shots to real provider 500s while Remotion went 3/3 and Cloudflare 4/4, so the runbook recommends demoing Remotion live (the guaranteed pathway, no external dependency) and showing a pre-generated Cloudflare result for photoreal output. Run 2 also became the best evidence yet for ADR-028's desync guard — with two shots dropped, the captions correctly described the assembled 10s cut starting at 00:00:00.000 with shot 2's text, not the authored 17s one. Run 3 independently demonstrated FR-8's critic loop on real output: shots 1 and 4 passed the vision critic first time, shots 2 and 3 failed and were automatically regenerated (2 and 1 retries) before finalizing with verdicts recorded."

