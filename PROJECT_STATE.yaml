project:
  name: "VidCraft"
  full_title: "VidCraft: A Multi-Agent, Retrieval-Augmented Pipeline for Prompt-Driven Video Generation"
  version: "0.0.0-pre-development"
  status: "in_progress"
  current_phase: "phase_0_1_research_env_setup"
  completion_percent: 68.6
  completion_basis: "verified_tasks / total_tasks (24 / 35) — see PROJECT_ARCHITECTURE.md Section 20 for the full task list"
  last_updated: "2026-08-11"
  last_updated_by: "Claude (Sonnet 5) — AI-008 (sentence-similarity intent check + retry loop): ai-service/orchestrator/similarity.py's compute_similarity() adds a 4th LangGraph node (screenwriter -> cinematographer -> intent_check -> producer -> END) that embeds the clarified prompt and the storyboard's joined shot descriptions with the existing RAG-001 all-MiniLM-L6-v2 encoder and compares them via cosine similarity; below STORYBOARD_SIMILARITY_THRESHOLD (0.35, ADR-018) the graph routes back to the Screenwriter, bounded by MAX_STORYBOARD_RETRIES (2) attempts tracked via a new attempt_count state field, after which it finalizes the last attempt rather than failing the request (mirrors FR-8's critic-loop exhaustion behavior). 5 new offline tests (71/71 total pass); live-verified end-to-end in WSL2 against the real Groq API + real embedder — a normal run passed on the first attempt (real similarity ~0.7, well above the 0.35 default), and a forced impossible threshold (1.5) exercised the retry ceiling for real, logging attempt 1/3 -> retry, 2/3 -> retry, 3/3 -> finalize, confirming the bounded loop actually terminates rather than hanging. Completes the RAG-001..003 + AI-007 + AI-008 orchestrator vertical (FR-3/FR-4) fully; PROVIDER-001 is next on the remaining critical-path chain (external-API pathway)."
  repository_reality: "Git repo pushed to https://github.com/Majid580/Vidcraft (main branch). backend/ is a working Express app (health-check verified) with real REST routes (BACKEND-004: POST /api/prompts, POST /api/prompts/:id/clarify, POST /api/storyboards, GET /api/storyboards/:id) that round-trip through a real MongoDB connection (Prompt/Storyboard Mongoose schemas, native Windows service, not Docker — see resolved_blockers) AND a real HTTP call to ai-service (aiServiceClient.js) — AI-002/003/004/005 are no longer only reachable directly on the ai-service port. Centralized error handling (middleware/errorHandler.js) and request validation (middleware/validation.js) are wired in app.js. backend/ can also invoke real Remotion renders (remotionService.js), not yet wired into the storyboard routes (that's INTEG-001). ai-service/ is a working FastAPI app run from WSL2 (health-check verified, per ADR-008) and exposes: (1) POST /analyze (AI-002, FR-1 five-dimension prompt scorer), (2) POST /clarify/questions + POST /clarify/resolve (AI-003, FR-2 clarification agent, real Groq API calls, unit-tested with a mocked LLM and live-verified end-to-end including a re-analysis showing score improve from 33 to 72), and (3) POST /storyboard/generate (AI-004+AI-007+AI-005, a real LangGraph StateGraph — Screenwriter node decomposes a clarified prompt into a 3-5 shot storyboard, Cinematographer node then grounds each shot's camera + world_state.style_tokens in the RAG-003 persisted vector index, Producer/Router node then assigns each shot's pathway per the ADR-013 photorealism heuristic; live-verified end-to-end including a mixed prompt that correctly split 1 external_api / 2 remotion shots, a film-noir prompt whose grounded camera/style_tokens matched real corpus technique vocabulary, and confirmed the remotion-routed output chains directly into REMOTION-003's renderShot()). frontend/ is a working Vite/React/Tailwind/shadcn-ui app (verified rendering in-browser). remotion/ has 4 compositions plus a programmatic render-shot.mjs entry point with shot->composition selection + documented fallback, verified end-to-end from the backend. Shots routed to external_api cannot currently be rendered (BACKEND-005/PROVIDER-001 not implemented). A Bull.js/Redis queue now exists (BACKEND-003, backend/src/queues/generationQueue.js, Redis running inside WSL2) but nothing enqueues real jobs onto it yet — POST /api/storyboards is still synchronous, deviating from the PROPOSED async 202 shape — see ADR-014. Wiring the queue into that route (or a generation route) is INTEG-001/BACKEND-005 territory, not done here. A RAG vector-index scaffold now exists (RAG-001, ai-service/rag/{index,embedder}.py): a FAISS IndexFlatIP + JSON metadata sidecar wrapped by VectorIndex, with the real all-MiniLM-L6-v2 encoder (384-dim, cosine) lazily loaded, live-verified end-to-end (empty-index query returns [] gracefully; a small cinematography corpus embeds, ranks a semantic query sensibly, and survives a save/reload round-trip). A curated corpus now exists too (RAG-002, ai-service/rag/corpus/): 75 license-clean, original cinematography technique passages (cinematography.json) across 8 categories + a validating load_corpus() loader, in the exact VectorIndex.add() item shape. That corpus is now embedded into a persisted production index (RAG-003, ai-service/rag/build_index.py — build_index() + `python -m rag.build_index` writes rag/data/style_index.{faiss,meta.json}, 384-dim, a gitignored derived artifact rebuilt from the committed corpus; live-verified reload + semantic ranking). The Cinematographer node (AI-007, ai-service/orchestrator/agents/cinematographer.py) now queries that index for real, as the third LangGraph node (screenwriter -> cinematographer -> intent_check -> producer), grounding each shot's camera and world_state.style_tokens in retrieved corpus passages — live-verified to use real corpus technique vocabulary. A fourth node, the intent-similarity check (AI-008, ai-service/orchestrator/similarity.py + graph.py), now sits between Cinematographer and Producer: it embeds the clarified prompt and the joined shot descriptions with the same all-MiniLM-L6-v2 encoder and, below a 0.35 cosine-similarity threshold (ADR-018), routes back to the Screenwriter for up to 2 bounded retries (tracked via attempt_count) before finalizing the last attempt — live-verified to both pass through untouched on a normal real run and to actually retry-then-finalize when the threshold is forced impossibly high. MongoDB metadata sync (Section 10 embeddings collection) stays DEFERRED per ADR-017 (sole reader AI-007 hits FAISS directly; no Mongo client in the Python service), with the JSON sidecar as the canonical store. The LLM layer (ai-service/llm/) is now fallback-aware (AI-006): the single complete_json(system,user,temperature)->dict entrypoint (llm/completion.py) calls Groq primary (llm/groq_client.py) and, only on a provider failure (429/5xx/connection/no-key/bad-JSON), transparently falls back to a HOSTED OpenAI-compatible endpoint (llm/http_llm_client.py) — per ADR-015 never a local model (the user ruled out on-device LLM/heavy compute for UX/resource reasons; an Ollama draft was written and removed this session). Default fallback is a second Groq model (llama-3.1-8b-instant) on the same free key (ADR-016), env-overridable to any independent provider. All of AI-003/004/005 gained this resilience for free since the contract was unchanged. NOTE (ADR-015): RAG-001's embedder still runs local sentence-transformers+torch; the user deferred migrating it (2026-08-10) — keep local for now, move to a hosted embeddings API only if it measurably slows the machine."
