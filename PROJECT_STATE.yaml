# BLOCK-001 (spaCy blocked by Windows Smart App Control) was found and
# resolved on 2026-08-10 — see resolved_blockers below and
# PROJECT_PROGRESS.md Section 9 for the full record.

resolved_blockers:
  - id: "BLOCK-001"
    problem: "spaCy could not be imported in a native-Windows Python venv"
    cause: "Windows Smart App Control (Code Integrity policy) blocked spaCy's unsigned compiled Cython .pyd files one at a time"
    resolution: "ai-service now runs inside WSL2 (Ubuntu). Set up ai-service/.venv-wsl, installed spacy 3.8.15 + en_core_web_sm, verified with a real-sentence smoke test (tokenize/POS/NER all correct)."
    resolved_on: "2026-08-10"
    resolved_by: "Claude (Sonnet 5), with user running `sudo apt install python3-venv python3-pip` in WSL"

next_tasks:
  - id: "BACKEND-001"
    reason: "Backend scaffold — parallel with AI-001 and FRONTEND-001 once SETUP-002 is done"
  - id: "AI-001"
    reason: "AI microservice scaffold — parallel with BACKEND-001 and FRONTEND-001"
  - id: "FRONTEND-001"
    reason: "Frontend scaffold — parallel with BACKEND-001 and AI-001"

decisions:
  - id: "ADR-001"
    title: "LangGraph for multi-agent orchestration"
    date: "2026-08-10"
    summary: "Chosen over a hand-rolled if/else pipeline for explicit, inspectable control flow and bounded retry cycles."
  - id: "ADR-002"
    title: "Groq as primary LLM, secondary provider as fallback only"
    date: "2026-08-10"
    summary: "Minimizes compounding latency across multiple sequential agent calls per generation."
  - id: "ADR-003"
    title: "Dual-mode generation: Remotion (guaranteed) + tiered external APIs (best-effort)"
    date: "2026-08-10"
    summary: "Keeps the system demonstrable at zero cost; avoids an unsupportable guaranteed-consistency claim on the API pathway."
  - id: "ADR-004"
    title: "FAISS + MongoDB metadata instead of a managed vector database"
    date: "2026-08-10"
    summary: "Simplicity; avoids adding another managed/paid dependency."
  - id: "ADR-005"
    title: "Bounded retry loops everywhere (default max 2)"
    date: "2026-08-10"
    summary: "Predictable cost and demo timing; never unbounded self-refinement."
  - id: "ADR-006"
    title: "Evaluation study uses an independent metric, not the triggering spaCy heuristic"
    date: "2026-08-10"
    summary: "Avoids circularity between the enhancement trigger and the evaluation metric."
  - id: "ADR-007"
    title: "Scope deliberately trimmed (single TTS provider, small tiered API set)"
    date: "2026-08-10"
    summary: "Keeps the project achievable for a 4-person team within the timeline."

open_questions:
