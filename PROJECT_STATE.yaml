        verified_on: "2026-08-12"
        verified_by: "Claude (Sonnet 5) — 8 new offline pytest tests pass in ai-service/.venv-wsl (baseline.py: single-call contract + malformed-output rejection, mocked LLM; run_baseline.py: result-record shape, per-prompt failure isolation, one-record-per-prompt, mocked generator+scorer); full ai-service suite re-run afterward, 84/84 total pass, zero regressions. Live end-to-end in WSL2 against the real Groq API + real spaCy pipeline: ran `python -m evaluation.run_baseline` over all 50 EVAL-001 prompts (paced 2.5s/call, ~24 req/min, well under the Groq free-tier 30 req/min cap) — 50/50 succeeded, zero errors, results persisted to ai-service/evaluation/results/baseline_results.json."
        note: "ai-service/evaluation/baseline.py (generate_baseline(prompt) — ONE complete_json call, no clarification/RAG/multi-shot decomposition/retry loop, per ADR-024) + run_baseline.py (run(prompts) — records original+enhanced FR-1 spaCy scores per prompt, isolates per-prompt failures, writes evaluation/results/baseline_results.json). Real generation/rendering and the CLIPScore-style alignment metric are deliberately NOT run here — see ADR-024 for why (undecided rendering methodology; avoids rendering ~50-100 videos before EVAL-004 fixes what's actually scored). Real-run finding worth carrying to the final report as-is (FR-12 accepts either directional outcome): average spaCy overall_score did NOT improve from the single-shot enhancement (70.4 -> 69.6 across 50 prompts; 18 improved / 4 unchanged / 28 worse), primarily via a drop in the temporal_coherence dimension on longer present-tense paragraphs — a property of the ADR-010 heuristic, not evidence the enhancement itself is worse; this is exactly the kind of case ADR-006 anticipated when it ruled spaCy out as the study's ground-truth metric. EVAL-003 (multi-agent condition) can follow the same runner shape (load EVAL-001, pace calls, isolate failures, write one results JSON) without sharing code, since it calls orchestrator/graph.py instead of baseline.py."
      - id: "EVAL-003"
        name: "Run multi-agent condition"
        status: "IN_PROGRESS"
        priority: "MEDIUM"
        dependencies: ["INTEG-001", "EVAL-001"]
        note: "ai-service/evaluation/multiagent.py (generate_multiagent(prompt) -- calls the production orchestrator.graph.build_graph() directly, raw prompt as clarified_prompt, no clarification round-trip, mirroring ADR-024's Condition A design per ADR-025) + run_multiagent.py (same paced/isolate-failures/results-JSON shape as run_baseline.py, plus a --resume flag). 6 new offline pytest tests pass; full suite 91/91, zero regressions. Live run against the real Groq API: 27/50 prompts succeeded (real RAG-grounded storyboards, all first-attempt passes, similarity_score 0.475-0.926) before hitting a real Groq per-model daily token cap (~100k TPD for llama-3.3-70b-versatile, both primary and fallback exhausted -- see ADR-025 and memory/groq_free_tier_limits.md, corrected from the previously-assumed 1M/day figure). Results (27 ok + 23 error, real 429 messages) persisted to evaluation/results/multiagent_results.json. DELIBERATE STOP, 2026-08-12: a Windows Task Scheduler entry to auto-resume the remaining 23 the next day was set up, then cancelled per direct user instruction -- the 23 failures have a single, understood, non-code cause (Groq's real daily quota) and would very likely succeed on retry, so the team chose not to wait on/pursue completing them right now, same pattern as BACKEND-005's video-tier hold (ADR-021). NOT marked VERIFIED (the task's own criterion -- results for all 50 -- isn't met), but this is a deliberate, team-directed stop, not an active blocker anyone is working around. `python -m evaluation.run_multiagent --resume` (reuses the 27 real results, only reruns the missing 23) remains available to run manually if the team wants the full 50 later. Real finding from the 27 completed (reportable as-is): spaCy overall_score dropped even more than EVAL-002's baseline (69.3 -> 54.3, 26/27 worse) -- very likely because joining short per-shot descriptions with '. ' reads as choppier to the heuristic than a single flowing paragraph, not a real quality gap; reinforces ADR-006's spaCy-is-not-ground-truth stance ahead of EVAL-004's CLIPScore metric. UPDATE 2026-08-13 -- RESUMED 27/50 -> 46/50: Groq's daily quota had reset, so run_multiagent --resume was run by hand; it reused the 27 already-'ok' records untouched and spent the fresh day's budget only on the 23 failures, 19 of which passed. The last four (nature-2, romance-1, romance-2, romance-3) hit the same wall, and this time the 429 body names the limit outright rather than leaving it to inference: 'on tokens per day (TPD): Limit 100000, Used 99691, Requested 481' -- an exact live confirmation of the ~100k/day per-model figure that memory/groq_free_tier_limits.md had carried only as an empirical estimate. This is NOT a reversal of the earlier instruction to stop pursuing the remainder: what was cancelled was AUTOMATING a wait for the quota reset (a scheduled task); running --resume manually on a later day, when the quota had already reset and the work was asked for, is exactly the path ADR-025's resolution note left open. Results file now holds 46 ok + 4 error records. EVAL-004 does not wait on the last four -- it compares on the PAIRED subset and reports the exclusions in its own coverage table."
      - id: "EVAL-004"
        name: "Score both conditions"
        status: "IN_PROGRESS"
        priority: "MEDIUM"
        dependencies: ["EVAL-002", "EVAL-003"]
        note: "2026-08-13 (ADR-030): the SCORING ARM IS BUILT AND VERIFIED END TO END; the STUDY is a pilot. Three modules -- evaluation/media.py (Pollinations frame generation, disk-cached by content hash, rate-paced), evaluation/alignment.py (CLIPScore = 2.5*max(cos,0) on clip-ViT-B-32 via sentence-transformers), evaluation/run_scoring.py (pairs the conditions, aggregates, emits results/eval004_comparison.md -- the Section 4.7 deliverable -- plus results/eval004_scores.json). Ran for real: 24 real frames, real CLIP, ZERO retries, ZERO failures; 45/45 offline edge checks. THIS TASK NEVER NEEDED THE PAID VIDEO API: the metric is frame-level (CLIP embeds an image, not a clip) and the Remotion pathway animates those same stills rather than synthesising new pixels -- BACKEND-005's video tier is the only remaining item that genuinely needs the paid key, which is what unblocked this whole session. WHAT REMAINS IS SAMPLE SIZE, NOTHING ELSE: the published table is n=5 of the 46 paired prompts available, because frame generation was stopped early by team decision when the provider queue settled at ~1 frame/minute (~3h for the full 222-frame set). At n=5 NOTHING is established -- mean-of-shots -0.017 (p=0.685), best-shot +0.078 (p=0.136), per-genre cells of 2-3 prompts -- and the table carries that warning in a banner on its own front page. These numbers must NOT reach the final report as findings. Finishing re-spends nothing: frames are cached by content hash, so `python -m evaluation.run_scoring` resumes rather than restarts. A guard exists for this stopping mode -- a prompt is admitted only when EVERY one of its frames is cached, because a mean-of-shots averaged over whichever shots finished first is a different statistic wearing the same name; 41 partial prompts were excluded on that rule rather than quietly averaged."

