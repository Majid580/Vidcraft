  last_updated: "2026-08-12"
  last_updated_by: "Claude (Sonnet 5) — EVAL-002: ran the single-shot baseline condition (FR-12 Condition A) across all 50 EVAL-001 prompts. ai-service/evaluation/baseline.py's generate_baseline(prompt) is one complete_json call with no clarification round-trip, no RAG grounding, no multi-shot decomposition, no retry loop -- the direct structural counterpoint to the AI-004/007/008 multi-agent pipeline (ADR-024 records the scope decision). ai-service/evaluation/run_baseline.py's run(prompts) drives it over the fixed EVAL-001 set, paced at 2.5s/call to stay under Groq's free-tier 30 req/min cap, records both original- and enhanced-text FR-1 spaCy scores per prompt (reported, not the study's ground-truth metric per ADR-006), isolates any single prompt's failure rather than aborting the run, and writes evaluation/results/baseline_results.json. 8 new offline pytest tests pass (mocked LLM/scorer); full ai-service suite re-run afterward, 84/84 total pass, zero regressions. Live end-to-end in WSL2 against the real Groq API + real spaCy pipeline: all 50 prompts succeeded (50/50, zero errors). Deliberately did NOT run real media generation or the CLIPScore-style alignment metric here -- ADR-024 explains why (the rendering methodology isn't decided yet; building ~50-100 renders now risks redoing them once EVAL-003/EVAL-004 settle it). Real, reportable finding: baseline spaCy overall_score did not improve on average (70.4 -> 69.6 across 50 prompts; 18 improved / 4 unchanged / 28 worse), mostly via temporal_coherence dropping on longer present-tense paragraphs -- a property of the ADR-010 heuristic, not evidence the enhancement is worse, and exactly the kind of result ADR-006 anticipated when it excluded spaCy as the study's ground truth. EVAL-002 is now the top item moved to VERIFIED; EVAL-003 (multi-agent condition, same runner shape, calls orchestrator/graph.py instead) is next, followed by EVAL-004 (scoring, which will also need to settle the media-generation question ADR-024 deferred). Prior update, retained below: Claude (Sonnet 5) — EVAL-001: curated the fixed 50-prompt evaluation set (ai-service/evaluation/dataset/), mirroring the RAG-002 corpus-curation template (JSON + validating loader + offline pytest). 50 original prompts (never copied from any external source) across 15 genres, tagged with a complexity field (26 single-beat / 24 multi-beat) to satisfy the roadmap's 'covering single-shot and multi-shot ideas' criterion explicitly rather than leaving it implicit. Deliberately moderate descriptive detail per prompt so EVAL-002 (baseline)/EVAL-003 (multi-agent) has room to show a real difference. 9 new offline pytest tests pass; full ai-service suite re-run afterward confirmed 76/76 total pass, zero regressions (71 prior + 9 new − 4 tests retired with the Producer agent, ADR-020). EVAL-001 is curation only — no runner scripts, no scoring; EVAL-002/003/004 are next. Prior update, retained below: Claude (Sonnet 5) — INTEG-001 real full-stack E2E confirmation run: started all four real services (ai-service via WSL2 uvicorn, backend via node src/app.js, real local MongoDB, real WSL2 Redis) plus the frontend Vite dev server, then drove the actual browser UI through the full pipeline with no stubs/mocks/demo-mode anywhere. Confirmed the two previously-isolated INTEG-001 halves (backend HTTP integration test; frontend demo-mode run) genuinely connect: prompt analysis -> real Groq-backed LangGraph storyboard generation grounded in the real RAG-003 index -> real async Bull job -> real Remotion rendering -> real MP4s played back correctly in-browser (verified via each <video> element's readyState/duration/dimensions, not just that the request returned 200). Zero console errors. Marked INTEG-001 VERIFIED (see its task entry below) — this was the last explicitly-flagged remaining item for that task. Surfaced one non-blocking issue in the process, recorded as R-14 in PROJECT_ARCHITECTURE.md Section 24 and root-caused same session: POST /api/prompts / POST /api/storyboards each fired twice — first suspected as a StrictMode frontend bug, corrected after the team clarified a team member had separately opened the same dev frontend and clicked Generate while this run used the same dev backend concurrently, so two independent real clients raced, not one click double-firing. The resulting duplicate storyboard-creation race (one branch hit a Mongoose VersionError, the other self-healed) is still a real, worth-hardening dedup gap, just from a mundane concurrent-access cause rather than a client defect. Did not block the confirmation run's success criterion. Next: EVAL-001 (curate the 50-prompt test set) is now the top unblocked item; R-14 hardening is a good secondary pickup. Prior update, retained below: Claude (Opus 4.8) — INTEG-001 frontend slice: wired the UI to the async generation backend. handleGenerate now chains storyboard creation straight into POST /api/storyboards/:id/generate, then polls GET /api/jobs/:id every 1.5s (recursive setTimeout in App.tsx, cancelled on completion/reset/unmount); StoryboardView renders a generation progress bar, per-shot status pills, and the finished asset_urls from /media (img for stills, <video> for .mp4), with a Regenerate button. lib/api.ts gained startGeneration()/getJob() (+ a GET helper), lib/types.ts gained GenerateResponse/JobStatus + Shot.asset_url/error/on_hold, lib/demo.ts simulates the same poll loop client-side (demoStartGeneration/demoGetJob). Verified in-browser via demo mode (identical App poll + StoryboardView render code to the real path; the real endpoints were already verified 11/11 in the backend integration test): happy path (3 shots -> Done, progress 0->100, 3 assets rendered, Regenerate/Create-another shown) and the video-held path (huggingface -> 3 shots On hold + amber message, 0 assets, 100%), zero console errors; tsc -b + oxlint clean. Files: frontend/src/App.tsx, frontend/src/components/StoryboardView.tsx, frontend/src/lib/{api,types,demo}.ts. Closes the prompt->rendered-output loop in the UI for the image/Remotion pathways (video stays held). REMAINING for full INTEG-001: a real full-stack end-to-end confirmation run, POST /api/storyboards async, optional WebSocket push. Prior update, retained below: Claude (Opus 4.8) — INTEG-001 async generation backend (ADR-023): wired the BACKEND-003 Bull/Redis queue for real. POST /api/storyboards/:id/generate is now genuinely async — enqueues one per-storyboard job and returns 202 {jobId,storyboardId,status}; the in-process worker (backend/src/queues/generationQueue.js) renders/generates each shot via the unchanged generationService adapters, persisting per-shot status/asset_url/error to Mongo incrementally and reporting job.progress() 0-100; new GET /api/jobs/:id (backend/src/routes/jobs.js) polls state/progress/shots; new Storyboard.job_id enables in-flight dedup + reconnect. Resolves the ADR-014/ADR-021 synchronous stopgap for /generate. Verified via an HTTP integration run against real Express+Bull+Redis(WSL2)+Mongo (only per-shot generation stubbed for speed/determinism, since the adapters were already verified in ADR-021): 202->active->completed, progress 0/33/67/100, three shot outcomes (completed+asset_url / on_hold / failed+error), in-flight dedup returns the same job, GET /api/jobs/<bogus> and POST /generate on an unknown storyboard both 404 — 11/11 checks, deterministic across 3 runs. Files: backend/src/queues/generationQueue.js (real processor), backend/src/routes/storyboards.js (async /generate), backend/src/routes/jobs.js (new), backend/src/models/Storyboard.js (+job_id), backend/src/app.js (+jobs route), .gitignore (+*.rdb). Backend-only — the frontend never called /generate, so no UI change; wiring the frontend to call/poll/render is the remaining INTEG-001 slice (see next_tasks). Prior update, retained below: Claude (Opus 4.8) — voice-to-text prompt input (ADR-022): implemented the standing team request — a press-to-talk mic on the prompt composer that streams transcribed speech into the prompt box — via the browser-native Web Speech API rather than a hosted Groq whisper-large-v3 endpoint, because interimResults streams words live as you speak (a record-then-POST flow can't) and it honors ADR-015's no-local-heavy-compute rule (Chrome/Edge transcribe on the vendor cloud — zero PC load, no torch/whisper) at zero backend/key/cost and without touching the Groq free-tier quota. Built as two hooks + one component: useSpeechRecognition.ts (raw recognizer wrapper, {supported,listening,transcript,interim,error,start,stop,reset}), useDictation.ts (binds it to one field, owns the press-and-hold gesture — pointer capture + keyboard Space/Enter hold for accessibility — and merges speech after existing text via mergeSpoken), and DictationMic.tsx (self-contained mic button, renders nothing when unsupported). Interaction is true press-and-hold (walkie-talkie: talk while held, release to stop), not toggle. Wired into TWO places: PromptComposer.tsx (mic in the prompt textarea + pulsing Listening indicator + friendly permission/no-speech error copy) and ClarificationChat.tsx (one mic beside EVERY answer box). Graceful degradation hides the mic on Firefox/older Safari. tsc -b + oxlint clean. Live-verified in the in-app Chromium: composer mic renders as Hold-to-dictate/Hold-to-talk with padding at 56px; demo-mode flow reached ClarificationChat with exactly one Hold-to-talk mic per answer; pointer + keyboard hold gestures fired without crashing; the mic-blocked sandbox exercised the not-allowed path (friendly error shown, aria-pressed reset to false, no stuck listening state); served module verified clean, no Vite error overlay (true streaming needs a real mic, unavailable here). Additive team feature outside the 35-task roadmap (like ADR-021's single-image mode), so the verified-task count is unchanged. See next_tasks for what's next (INTEG-001 real async queue wiring; BACKEND-005 video stays a deliberate hold). Prior update, retained below: Claude (Sonnet 5) — ADR-021: per direct team instruction, wired real per-shot generation for the free image providers (pollinations/cloudflare, plus remotion) via new generationService.js and POST /api/storyboards/:id/generate, while deliberately holding huggingface (video) — not attempted, not retried — pending a paid API key. Also added an additive single-image mode (POST /api/images + frontend mode toggle) after the team asked whether image-provider storyboards should collapse to one image; clarified that's a separate, new capability rather than a change to the existing multi-shot storyboard/FR-9/evaluation-study design, and built it as such. Live-verified end-to-end (backend curl round-trips + a full real browser session covering both single-image and multi-shot storyboard flows, zero console errors). BACKEND-005 remains IN_PROGRESS (video tier intentionally unmet) — see next_tasks for what's actually next: voice-to-text prompt input. Prior update, retained below: AI-008 (sentence-similarity intent check + retry loop): ai-service/orchestrator/similarity.py's compute_similarity() adds a 4th LangGraph node (screenwriter -> cinematographer -> intent_check -> producer -> END) that embeds the clarified prompt and the storyboard's joined shot descriptions with the existing RAG-001 all-MiniLM-L6-v2 encoder and compares them via cosine similarity; below STORYBOARD_SIMILARITY_THRESHOLD (0.35, ADR-018) the graph routes back to the Screenwriter, bounded by MAX_STORYBOARD_RETRIES (2) attempts tracked via a new attempt_count state field, after which it finalizes the last attempt rather than failing the request (mirrors FR-8's critic-loop exhaustion behavior). 5 new offline tests (71/71 total pass); live-verified end-to-end in WSL2 against the real Groq API + real embedder — a normal run passed on the first attempt (real similarity ~0.7, well above the 0.35 default), and a forced impossible threshold (1.5) exercised the retry ceiling for real, logging attempt 1/3 -> retry, 2/3 -> retry, 3/3 -> finalize, confirming the bounded loop actually terminates rather than hanging. Completes the RAG-001..003 + AI-007 + AI-008 orchestrator vertical (FR-3/FR-4) fully. Then PROVIDER-001 (ADR-019): selected AND live-validated Tier 1 free providers — Pollinations.ai for image (no account, live-verified via curl) plus Cloudflare Workers AI as a validated alternate image provider (real account+token confirmed live, real text-to-image catalog of 287 models), and Hugging Face for video (token live-verified via whoami — this is the actual video provider, not a fallback: once real Cloudflare credentials existed, its live catalog was checked directly and has NO video-generation model at all, correcting the initial research-based pick same-day before any code was built on it) — plus a Tier 2/3 paid gateway (fal.ai, selected but deliberately not wired up — free-only while testing, per team direction). R-8 resolved. BACKEND-005 is next on the remaining critical-path chain (external-API pathway), and both Tier 1 credentials already live in backend/.env."
  repository_reality: "Git repo pushed to https://github.com/Majid580/Vidcraft (main branch). backend/ is a working Express app (health-check verified) with real REST routes (BACKEND-004: POST /api/prompts, POST /api/prompts/:id/clarify, POST /api/storyboards, GET /api/storyboards/:id) that round-trip through a real MongoDB connection (Prompt/Storyboard Mongoose schemas, native Windows service, not Docker — see resolved_blockers) AND a real HTTP call to ai-service (aiServiceClient.js) — AI-002/003/004/005 are no longer only reachable directly on the ai-service port. Centralized error handling (middleware/errorHandler.js) and request validation (middleware/validation.js) are wired in app.js. backend/ can also invoke real Remotion renders (remotionService.js), not yet wired into the storyboard routes (that's INTEG-001). ai-service/ is a working FastAPI app run from WSL2 (health-check verified, per ADR-008) and exposes: (1) POST /analyze (AI-002, FR-1 five-dimension prompt scorer), (2) POST /clarify/questions + POST /clarify/resolve (AI-003, FR-2 clarification agent, real Groq API calls, unit-tested with a mocked LLM and live-verified end-to-end including a re-analysis showing score improve from 33 to 72), and (3) POST /storyboard/generate (AI-004+AI-007+AI-005, a real LangGraph StateGraph — Screenwriter node decomposes a clarified prompt into a 3-5 shot storyboard, Cinematographer node then grounds each shot's camera + world_state.style_tokens in the RAG-003 persisted vector index, Producer/Router node then assigns each shot's pathway per the ADR-013 photorealism heuristic; live-verified end-to-end including a mixed prompt that correctly split 1 external_api / 2 remotion shots, a film-noir prompt whose grounded camera/style_tokens matched real corpus technique vocabulary, and confirmed the remotion-routed output chains directly into REMOTION-003's renderShot()). frontend/ is a working Vite/React/Tailwind/shadcn-ui app (verified rendering in-browser). remotion/ has 4 compositions plus a programmatic render-shot.mjs entry point with shot->composition selection + documented fallback, verified end-to-end from the backend. Shots routed to external_api cannot currently be rendered (BACKEND-005/PROVIDER-001 not implemented). A Bull.js/Redis queue now exists (BACKEND-003, backend/src/queues/generationQueue.js, Redis running inside WSL2) but nothing enqueues real jobs onto it yet — POST /api/storyboards is still synchronous, deviating from the PROPOSED async 202 shape — see ADR-014. Wiring the queue into that route (or a generation route) is INTEG-001/BACKEND-005 territory, not done here. A RAG vector-index scaffold now exists (RAG-001, ai-service/rag/{index,embedder}.py): a FAISS IndexFlatIP + JSON metadata sidecar wrapped by VectorIndex, with the real all-MiniLM-L6-v2 encoder (384-dim, cosine) lazily loaded, live-verified end-to-end (empty-index query returns [] gracefully; a small cinematography corpus embeds, ranks a semantic query sensibly, and survives a save/reload round-trip). A curated corpus now exists too (RAG-002, ai-service/rag/corpus/): 75 license-clean, original cinematography technique passages (cinematography.json) across 8 categories + a validating load_corpus() loader, in the exact VectorIndex.add() item shape. That corpus is now embedded into a persisted production index (RAG-003, ai-service/rag/build_index.py — build_index() + `python -m rag.build_index` writes rag/data/style_index.{faiss,meta.json}, 384-dim, a gitignored derived artifact rebuilt from the committed corpus; live-verified reload + semantic ranking). The Cinematographer node (AI-007, ai-service/orchestrator/agents/cinematographer.py) now queries that index for real, as the third LangGraph node (screenwriter -> cinematographer -> intent_check -> producer), grounding each shot's camera and world_state.style_tokens in retrieved corpus passages — live-verified to use real corpus technique vocabulary. A fourth node, the intent-similarity check (AI-008, ai-service/orchestrator/similarity.py + graph.py), now sits between Cinematographer and Producer: it embeds the clarified prompt and the joined shot descriptions with the same all-MiniLM-L6-v2 encoder and, below a 0.35 cosine-similarity threshold (ADR-018), routes back to the Screenwriter for up to 2 bounded retries (tracked via attempt_count) before finalizing the last attempt — live-verified to both pass through untouched on a normal real run and to actually retry-then-finalize when the threshold is forced impossibly high. MongoDB metadata sync (Section 10 embeddings collection) stays DEFERRED per ADR-017 (sole reader AI-007 hits FAISS directly; no Mongo client in the Python service), with the JSON sidecar as the canonical store. The LLM layer (ai-service/llm/) is now fallback-aware (AI-006): the single complete_json(system,user,temperature)->dict entrypoint (llm/completion.py) calls Groq primary (llm/groq_client.py) and, only on a provider failure (429/5xx/connection/no-key/bad-JSON), transparently falls back to a HOSTED OpenAI-compatible endpoint (llm/http_llm_client.py) — per ADR-015 never a local model (the user ruled out on-device LLM/heavy compute for UX/resource reasons; an Ollama draft was written and removed this session). Default fallback is a second Groq model (llama-3.1-8b-instant) on the same free key (ADR-016), env-overridable to any independent provider. All of AI-003/004/005 gained this resilience for free since the contract was unchanged. NOTE (ADR-015): RAG-001's embedder still runs local sentence-transformers+torch; the user deferred migrating it (2026-08-10) — keep local for now, move to a hosted embeddings API only if it measurably slows the machine. PROVIDER-001 (ADR-019) has now selected AND live-validated concrete external providers: Tier 1 free = Pollinations.ai + Cloudflare Workers AI (both image, Cloudflare confirmed live via its real account-scoped API) and Hugging Face (video — the actual provider, not a fallback, since that same live Cloudflare check found no video model in its real catalog, correcting research that had initially pointed there); Tier 2/3 paid = fal.ai, selected but intentionally not integrated yet. All three Tier 1 credentials are live and validated in backend/.env. No BACKEND-005 code exists yet — this is a provider-selection decision plus credential validation, not application code."
