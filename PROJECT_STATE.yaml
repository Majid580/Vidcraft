    title: "Dual-mode generation: Remotion (guaranteed) + tiered external APIs (best-effort)"
    date: "2026-08-10"
    summary: "Keeps the system demonstrable at zero cost; avoids an unsupportable guaranteed-consistency claim on the API pathway."
  - id: "ADR-004"
    title: "FAISS + MongoDB metadata instead of a managed vector database"
    date: "2026-08-10"
    summary: "Simplicity; avoids adding another managed/paid dependency."
  - id: "ADR-005"
    title: "Bounded retry loops everywhere (default max 2)"
    date: "2026-08-10"
    summary: "Predictable cost and demo timing; never unbounded self-refinement."
  - id: "ADR-006"
    title: "Evaluation study uses an independent metric, not the triggering spaCy heuristic"
    date: "2026-08-10"
    summary: "Avoids circularity between the enhancement trigger and the evaluation metric."
  - id: "ADR-007"
    title: "Scope deliberately trimmed (single TTS provider, small tiered API set)"
    date: "2026-08-10"
    summary: "Keeps the project achievable for a 4-person team within the timeline."
  - id: "ADR-008"
    title: "ai-service runs inside WSL2 (Ubuntu), not native Windows Python"
    date: "2026-08-10"
    summary: "Resolves BLOCK-001 (spaCy blocked by Windows Smart App Control) without disabling a system security feature."
  - id: "ADR-009"
    title: "Remotion lives in a dedicated top-level remotion/ directory, not inside ai-service/"
    date: "2026-08-10"
    summary: "Remotion is a Node/React toolkit; keeps it isolated from the Python ai-service, mirroring frontend/backend separation."
  - id: "ADR-010"
    title: "FR-1 scoring formula: equal-weight average, 40-point flag threshold"
    date: "2026-08-10"
    summary: "overall_score is the unweighted mean of the 5 dimension scores; any dimension below 40/100 raises its corresponding flag+suggestion. Simplest defensible default absent a specified formula (R-12); documented here rather than left as a silent hard-coded choice. Per-dimension heuristics (subject-clarity from nsubj/nsubjpass presence, action-specificity from a vague-verb lemma list, environment-detail from GPE/LOC/FAC NER + locative prepositions + time-of-day words, visual-richness from adjective density, temporal-coherence from temporal-marker presence + finite-tense mixing) live as inline comments in ai-service/analyzer/scoring.py. Revisit if the curated 50-prompt test set (EVAL-001) shows systematic miscalibration."
  - id: "ADR-011"
    title: "Concrete Groq model selected: llama-3.3-70b-versatile"
    date: "2026-08-10"
    summary: "Section 11.2 left the specific Groq model TBD. Queried the live Groq /models endpoint, selected llama-3.3-70b-versatile as the GROQ_MODEL default (env-overridable), confirmed via a live JSON-mode structured-output smoke test. Chosen over llama-3.1-8b-instant for stronger structured-reasoning quality on the orchestrator agents' tasks. The fallback-provider choice was later resolved by ADR-015 (hosted-only, never local) + ADR-016 (default = second Groq model llama-3.1-8b-instant)."
  - id: "ADR-012"
    title: "Screenwriter drafts full shot shape (camera + pathway placeholder), not just narrative fields"
    date: "2026-08-10"
    summary: "AI-004's Screenwriter agent drafts a best-effort camera value per shot and hardcodes pathway to 'remotion', both explicitly documented as placeholders for Producer/Router (AI-005) and Cinematographer (AI-007) to overwrite — lets the storyboard already flow into REMOTION-003 today instead of sitting unusable until those agents exist."
  - id: "ADR-013"
    title: "Producer/Router pathway heuristic: photorealism signal maps to external_api, else remotion"
    date: "2026-08-10"
    summary: "AI-005's Producer/Router agent sends each shot + world_state to Groq and asks whether the shot's description/style_tokens explicitly call for photorealistic/live-action output; if so, pathway=external_api, else remotion. Live-verified: a mixed prompt correctly split 1 external_api / 2 remotion. external_api-routed shots can't actually be rendered yet — BACKEND-005 (adapter layer) and PROVIDER-001 (concrete providers) don't exist yet; this is forward-looking routing only."

  - id: "ADR-014"
    title: "POST /api/storyboards is synchronous (201/completed), not the PROPOSED async 202/processing shape"
    date: "2026-08-10"
    summary: "PROJECT_ARCHITECTURE.md Section 9.2 proposed POST /api/storyboards return 202 {storyboardId, status: 'processing'} for an async job. BACKEND-004 implements it as a synchronous call instead — it awaits ai-service's /storyboard/generate directly and returns 201 with the completed storyboard — because BACKEND-003 (the Bull.js queue) doesn't exist yet, and faking a 'processing' status for a call that's actually already finished would be misleading rather than honest scaffolding. Revisit once BACKEND-003 lands: the route should move the ai-service call into a queued job and genuinely return 202/processing, with GET /api/storyboards/:id reporting real progress."
  - id: "ADR-015"
    title: "No local LLM / heavy on-device compute — all inference goes through hosted APIs"
    date: "2026-08-10"
    summary: "The user directed that no LLM or heavy work run locally: on-device inference consumes dev-machine resources and gives slow responses, degrading UX. AI-006's fallback was therefore implemented as a hosted OpenAI-compatible /chat/completions endpoint, not the initially-drafted local Ollama/llama3 provider (which was removed the same session after a cold-start warm-up exceeded 120s, confirming the concern). The policy is FIRM for the LLM path. SCOPE NUANCE (decided 2026-08-10): the user chose to KEEP RAG-001's local sentence-transformers+torch embedder (and AI-008's similarity check) for now and shift embeddings to a hosted API only IF it actually slows the machine down — so that migration is a DEFERRED, performance-contingent follow-up, not an urgent inconsistency. (Groq has no embeddings endpoint, so it would need a separate hosted embeddings provider.)"
  - id: "ADR-016"
    title: "Fallback LLM default: a second Groq model via the OpenAI-compatible endpoint"
    date: "2026-08-10"
    summary: "Section 13/.env.example left FALLBACK_LLM_PROVIDER TBD. AI-006 defaults it to a second Groq model (llama-3.1-8b-instant) reached through Groq's OpenAI-compatible base (https://api.groq.com/openai/v1) on the same free GROQ_API_KEY — zero cost, no extra signup, and a different per-model rate bucket than the primary llama-3.3-70b (directly mitigating the 30 req/min free-tier 429s). The client is provider-agnostic: FALLBACK_LLM_BASE_URL/API_KEY/MODEL override to any independent OpenAI-compatible host (OpenRouter, Together, Google Gemini's OpenAI-compat endpoint, OpenAI) with no code change. Caveat: a same-provider fallback does not cover a full Groq outage — revisit if an independent secondary is warranted (relates to R-8/R-13)."
  - id: "ADR-017"
    title: "RAG-003 keeps the MongoDB embeddings-collection sync deferred; the JSON sidecar stays canonical"
    date: "2026-08-11"
    summary: "Section 10.1 lists an `embeddings` collection as the eventual canonical MongoDB metadata store synced with FAISS, and RAG-001/ADR-004 deferred that sync 'to RAG-003 (corpus ingestion)'. On implementing RAG-003 the sync was DELIBERATELY kept deferred rather than built: (1) the only planned consumer, the Cinematographer (AI-007), reads the FAISS index directly via VectorIndex.load() — nothing reads the embeddings collection; (2) the Python ai-service has no Mongo client (no pymongo/motor dependency), so a sync would add a new dependency + a WSL2->Windows Mongo connection purely to write rows no code reads; (3) per ADR-004 the JSON sidecar written beside the index is already the canonical, self-contained, unit-testable metadata store. Adding an unread Mongo write would be speculative scaffolding, contrary to the project's honest-scaffolding stance (cf. ADR-014). The sidecar holds Mongo-ready {text, metadata} rows, so adopting the collection later (if prompt-similarity checks in AI-008 or a shared read path actually need it) is a straightforward load, not a re-embed. Revisit when a real reader of the embeddings collection exists."
  - id: "ADR-018"
    title: "Storyboard intent-similarity threshold: 0.35 cosine similarity, max 2 retries"
    date: "2026-08-11"
    summary: "R-12 left the storyboard similarity-check threshold undecided (the spaCy scoring half was already resolved by ADR-010). AI-008 adopts STORYBOARD_SIMILARITY_THRESHOLD=0.35 (env-overridable, config.py) as a documented default absent a specified value — the same pattern ADR-010 used for the spaCy formula. Chosen conservatively low relative to the ~0.7 cosine similarity observed between a real clarified prompt and its real generated storyboard in live verification (WSL2, real Groq + real all-MiniLM-L6-v2 embedder): 0.35 comfortably passes well-aligned storyboards on the first attempt without spurious retries, while still being low enough to catch genuine drift rather than never firing. MAX_STORYBOARD_RETRIES=2 reuses ADR-005's bounded-retry default (same as the critic loop, FR-8). Both values are revisit candidates once the curated 50-prompt evaluation set (EVAL-001) gives a larger sample to calibrate against."
  - id: "ADR-019"
    title: "Concrete Tier 1/2/3 external provider selection (PROVIDER-001)"
    date: "2026-08-11"
    summary: "Tier 1 (free, wired up now, credentials live-validated 2026-08-11): image = Pollinations.ai (no account/key, live-verified via curl) + Cloudflare Workers AI (validated alternate — real account+token confirmed live, real text-to-image catalog of 287 models: FLUX.1/FLUX.2, SDXL, Leonardo Phoenix); video = Hugging Face Inference Providers (the actual pick, not a fallback — token live-verified via whoami, correct inference.serverless.write scope). CORRECTED same day: video was initially assigned to Cloudflare based on secondary research citing 'FLUX 3 Video'/'HappyHorse 1.0' models; once real Cloudflare credentials existed, a direct query against Cloudflare's own live API (task filter, name-substring search, full task-taxonomy enumeration across all 287 models) found NO video-generation model or category at all — that research was wrong, corrected before any BACKEND-005 code was built on it. Tier 2/3 (paid): fal.ai selected as a single pay-as-you-go gateway (one key, many models) but deliberately not wired into any code path yet — the team chose to stay free-only during testing while keeping the Section 6.6 abstraction interface ready for a low-effort later switch. Resolves R-8. See PROJECT_ARCHITECTURE.md Section 12/13 for full detail."

  - id: "ADR-020"
    title: "Rendering pathway/provider is a user choice, not an automated agent decision — Producer/Router (AI-005) retired"
    date: "2026-08-11"
    summary: "The user picks exactly one of remotion/pollinations/cloudflare/huggingface once, before generation, applied uniformly to every shot. AI-005's per-shot LLM classification is removed from the LangGraph graph entirely. Supersedes ADR-013. See PROJECT_ARCHITECTURE.md for full detail."
  - id: "ADR-021"
    title: "Real per-shot generation wired for image providers only; video (Hugging Face) deliberately held; new single-image mode added"
    date: "2026-08-11"
    summary: "Per direct team instruction, real generation is now invoked for pollinations/cloudflare/remotion shots (POST /api/storyboards/:id/generate, generationService.js) while huggingface shots are deliberately NOT attempted (status:on_hold) pending a paid API key — not retried against a known-depleted free quota. A separate, additive single-image mode (POST /api/images) was also added, skipping the storyboard/shot decomposition entirely for a one-image-from-enhanced-prompt flow — does not change what an image-provider storyboard produces. Both live-verified end-to-end (backend + real browser session). See PROJECT_ARCHITECTURE.md for full detail."
  - id: "ADR-022"
    title: "Voice-to-text prompt input via the browser Web Speech API (not a hosted STT backend)"
    date: "2026-08-11"
    summary: "Standing team request (was the sole next_tasks item): a press-to-talk mic on the prompt box that streams transcribed speech into the textarea. Chose the browser-native Web Speech API (SpeechRecognition) over a hosted Groq whisper-large-v3 endpoint, because interimResults streams words live as you speak (a record-then-POST Whisper flow can't) and it honors ADR-015's no-local-heavy-compute rule (Chrome/Edge transcribe on the vendor's cloud — zero PC load, no torch/whisper) at zero backend/key/cost and without touching the Groq free-tier quota. Two layers: frontend/src/hooks/useSpeechRecognition.ts wraps the raw recognizer ({supported,listening,transcript,interim,error,start,stop,reset}); frontend/src/hooks/useDictation.ts binds it to one text field, owning the press-and-hold (walkie-talkie) gesture — hold via pointer capture (setPointerCapture guarded) AND keyboard hold (Space/Enter) for accessibility — and merging recognized speech after existing text (mergeSpoken collapses the seam to one space). frontend/src/components/DictationMic.tsx is a self-contained mic button on that hook (renders nothing when unsupported), used in TWO places: PromptComposer.tsx (mic in the prompt textarea, auto-padded, + pulsing Listening indicator and friendly not-allowed/no-speech/audio-capture error copy) and ClarificationChat.tsx (one mic beside EVERY answer box, so the whole clarify step is voice-capable). Graceful degradation: mic hidden on Firefox/older Safari, typed fields unaffected. Additive team feature outside the 35-task roadmap (like ADR-021's single-image mode) — verified-task count unchanged. useSpeechRecognition.ts is the sole swap seam for a future MediaRecorder->POST /api/transcribe path. Live-verified in the in-app Chromium: composer mic renders as Hold-to-dictate/Hold-to-talk with textarea padding at 56px; demo-mode flow reached ClarificationChat and confirmed exactly one Hold-to-talk mic per answer; pointer AND keyboard hold gestures fired without crashing; the mic-blocked sandbox exercised the not-allowed path for real (friendly error shown, aria-pressed reset to false with no stuck listening state); served module verified clean (no stale symbols), no Vite error overlay; tsc -b + oxlint clean. True streaming needs a real mic (unavailable in the sandbox). See PROJECT_ARCHITECTURE.md ADR-022 for full detail."
  - id: "ADR-023"
    title: "Async generation — one Bull job per storyboard + polling (resolves the ADR-014/ADR-021 synchronous stopgap)"
    date: "2026-08-11"
    summary: "INTEG-001 backend slice. POST /api/storyboards/:id/generate now enqueues ONE Bull job per storyboard on the BACKEND-003 `generation` queue and returns 202 {jobId,storyboardId,status} immediately; the in-process worker (queues/generationQueue.js processGeneration) iterates shots via the unchanged generationService adapters, persists each shot's status/asset_url/error to Mongo incrementally, and reports job.progress() 0-100. New GET /api/jobs/:id returns {jobId,state,progress,storyboardId,failedReason?,shots[]} (state/progress from Bull/Redis, shots from the storyboard doc). New Storyboard.job_id links the most-recent run (in-flight dedup + client reconnect). Decisions: job granularity = per-storyboard (per-shot fan-out deferred to CRITIC-001); job store = Bull/Redis only (Mongo `jobs` collection stays deferred, ADR-017 spirit); progress transport = polling GET /api/jobs/:id (proposal's WebSocket fallback), WebSocket push deferred. A per-shot failure or held huggingface (video) shot is recorded on that shot and the job continues; the job only fails on infra errors. Response changed 200->202 but the frontend never called /generate so no UI breaks. Best-effort (non-atomic) dedup: two truly-concurrent calls could parallel-save the same doc (VersionError) — hardening deferred. Verified via an HTTP integration run (real app+Bull+Redis+Mongo, generation stubbed): 202->active->completed, progress 0/33/67/100, three shot outcomes correct, dedup + 404s — 11/11, deterministic across 3 runs. See PROJECT_ARCHITECTURE.md ADR-023 for full detail."
  - id: "ADR-024"
    title: "EVAL-002 baseline condition scope — enhancement text + spaCy scores now; real media generation deferred"
    date: "2026-08-12"
    summary: "Condition A (ai-service/evaluation/baseline.py generate_baseline()) is ONE complete_json call -- no clarification, no RAG grounding, no multi-shot decomposition, no retry loop -- the structural counterpoint to the multi-agent pipeline. run_baseline.py runs it over all 50 EVAL-001 prompts, paced under Groq's 30 req/min free-tier cap, records original+enhanced FR-1 spaCy scores per prompt (reported only, per ADR-006), isolates per-prompt failures, writes evaluation/results/baseline_results.json. Real media generation and the CLIPScore-style alignment metric are deliberately NOT run in EVAL-002 -- the rendering methodology (which provider, which frame(s), video vs. still) isn't decided yet, and rendering ~50-100 videos before EVAL-004 fixes that risks redoing them; the decision is deferred to EVAL-003/EVAL-004 so it's made once for both conditions. Live-verified: 50/50 prompts succeeded against the real Groq API. Real finding (reportable as-is per FR-12's either-direction acceptance criterion): baseline spaCy overall_score did not improve on average (70.4->69.6; 18 up/4 flat/28 down), mostly via temporal_coherence dropping on longer present-tense text -- a heuristic artifact (ADR-010), not evidence of a worse enhancement, and exactly why ADR-006 excluded spaCy as the study's ground truth. See PROJECT_ARCHITECTURE.md ADR-024 for full detail."
  - id: "ADR-025"
    title: "EVAL-003 (Condition B) skips clarification too; run is quota-interrupted, resumable"
    date: "2026-08-12"
    summary: "ai-service/evaluation/multiagent.py's generate_multiagent(prompt) calls the production orchestrator.graph.build_graph() directly with the raw prompt as clarified_prompt -- no AI-003 clarification round-trip, mirroring Condition A's design (ADR-024) so the study compares 'single-shot vs multi-agent', not 'clarified vs unclarified'. Also surfaces attempt_count/similarity_score (present in the graph's final state, stripped by generate_storyboard()'s public shape) as retry/verdict diagnostics. run_multiagent.py mirrors run_baseline.py's shape plus a new --resume flag (reuse already-'ok' records, skip re-spending tokens). A live 50-prompt run hit a REAL, previously-uncharacterized constraint: Groq's per-model daily token cap for llama-3.3-70b-versatile is ~100k tokens/day in practice (not the 1M/day headline figure) -- 27/50 succeeded (all first-attempt, similarity_score 0.475-0.926) before both the primary and same-account fallback model 429'd. memory/groq_free_tier_limits.md corrected with the real figure. RESOLUTION same day: a Windows Task Scheduler auto-resume entry was set up then cancelled per direct user instruction -- the 23 failures have one understood, non-code cause and would very likely pass on retry, so the team chose to stop pursuing completion now rather than wait, the same pattern as BACKEND-005's video hold (ADR-021). EVAL-003 stays IN_PROGRESS/deliberately incomplete, not VERIFIED; `run_multiagent.py --resume` remains available to run manually later if wanted. Real finding from the 27 completed: spaCy overall_score dropped even more than EVAL-002's baseline (69.3->54.3, 26/27 worse) -- likely because joining short per-shot descriptions reads as choppier to the heuristic than one flowing paragraph, reinforcing ADR-006 rather than indicating a real quality gap. See PROJECT_ARCHITECTURE.md ADR-025 for full detail."
  - id: "ADR-026"
    title: "CRITIC-001 -- vision-model provider (Cloudflare, not Groq) and pathway scope (external-API images only, not Remotion)"
    date: "2026-08-12"
    summary: "Two proposal TBDs resolved by checking live, not assuming. (1) Provider: Groq's live /models catalog has zero vision-capable models, so the proposal's 'likely the fallback LLM' guess doesn't hold -- picked Cloudflare Workers AI's @cf/meta/llama-4-scout-17b-16e-instruct instead (already-validated PROVIDER-001 credentials, no new signup); a first candidate (llama-3.2-11b-vision-instruct) was gated behind a Community License requiring manual dashboard acceptance and was skipped rather than accepted on the user's behalf; llama-4-scout was live-verified against both a genuinely matching and mismatching real image before any code was written against it. (2) Scope: pathway === 'external_api' shots only. Discovered live that Remotion's guaranteed pathway renders a stylized placeholder (near-black theme background + a text caption fading in only after 50% duration, remotion/src/theme.ts/compositions/*.tsx), not a literal scene depiction -- a literal vision-vs-text critic correctly-but-uselessly fails it every time, which would exhaust CRITIC_MAX_RETRIES on every Remotion shot for no benefit. ai-service/critic/vision_client.py (evaluate_frame, new POST /critic/evaluate) + backend/src/services/criticService.js (runCriticLoop -- pathway filter, ffmpeg frame extraction, bounded regenerate-then-reevaluate loop) wired into generationQueue.js after each shot completes; reused the shot schema's pre-existing, previously-unused retry_count field. Live-verified end-to-end (real stack, no stubs): a real Pollinations image correctly passed critique, a paired Remotion shot correctly skipped the loop, and a deliberately adversarial description produced 2 genuine critic fails with retry_count reaching CRITIC_MAX_RETRIES (2), the shot finalized 'completed' with the last verdict -- a real demonstrated automatic retry cycle meeting FR-8's completion criterion. See PROJECT_ARCHITECTURE.md ADR-026 for full detail."
  - id: "ADR-027"
    title: "FR-7 continuity injection for the API pathway, and FR-9 concatenation in Remotion rather than FFmpeg"
    date: "2026-08-12"
    summary: "Two team-reported defects with one shared root cause -- the pipeline's two halves were never connected. (1) Remotion produced videos of only text because remotion/src/ contained NO <Img> element at all; the compositions drew a background colour, a gradient and <div>s of caption text. Remotion is a compositor, not a generative model -- nothing had ever handed it an asset. (2) Storyboard images were unrelated to each other because generationService.generateShotAsset() took worldState as its third parameter and never used it on the API pathway, passing a bare shot.description -- so AI-007's RAG-grounded style_tokens were computed, persisted, then discarded unread. FR-7's own table already specified the fix; it had simply never been implemented for that pathway. SELECTED: (a) continuity injected as prompt structure + deterministic per-shot seed + optional Cloudflare img2img reference anchoring via world_state.reference_image_url (backend/src/services/continuityPrompt.js); (b) framing vocabulary expanded and motion vocabulary dropped before reaching the image model -- framing goes to the image model, motion drives the Remotion camera move; (c) FR-9 concatenation in Remotion (StoryboardVideo + <Series>), not an FFmpeg concat demuxer. WHY THE SEED IS PER-SHOT: a single storyboard-wide seed was implemented first and is wrong -- live testing showed it pins the COMPOSITION, not just the palette, making a wide, a medium and a close-up all return the same front-facing portrait. Continuity comes from the repeated prompt block; the seed only provides per-shot reproducibility for FR-12. WHY FRAMING LEADS: framing/action originally sat at the prompt tail and lost to the invariant block, producing identically-framed shots; diffusion text encoders weight earlier tokens more heavily. Both corrections came from looking at real generated images, not from reasoning about the API. WHY REMOTION OVER FFMPEG: an FFmpeg concat of stills yields a slideshow, whereas every Remotion-assembled shot is already a moving shot; it also keeps one renderer in the stack, gives the FR-7 theme somewhere real to apply, and structurally closes R-10 (one renderer, fixed 1920x1080/30fps, no cross-source concat to mismatch). FFmpeg stays for FR-8 frame extraction and FR-9's unimplemented thumbnail/subtitle steps. Live-verified with 3 real Pollinations generations + a real Remotion render, no stubs: same subject/location/palette across all three, framing varying wide -> medium -> close, assembled into one 1920x1080 H.264 MP4 of exactly 300 frames (4+3+3s at 30fps), no text cards. Three real defects fixed en route: helmet's Cross-Origin-Resource-Policy blocked the headless browser from loading /media stills (fixed, scoped to /media); render-shot.mjs ran main() at import time; the shot->composition taxonomy moved to remotion/src/shotTaxonomy.mjs to be reachable from both Node and the browser bundle. FOLLOW-UP SAME DAY -- the Cloudflare img2img tier WAS then verified against real credentials, and defaulted OFF as a result. The API contract works as coded (image_b64 accepted; the img2img model returns raw PNG bytes rather than FLUX's JSON-with-base64, which the response branching handles). But a controlled comparison on the same three-shot storyboard showed anchoring makes the output worse: it inherits the reference's COMPOSITION, so a wide, a medium and a close-up all rendered as the same standing pose, at 512x512 (SD v1.5's default -- a quarter of FLUX's 1024x1024, since pinned to 1024) and ~6s/shot vs ~2.2s unanchored. A strength sweep found no escape: 0.65/0.75 copy the reference layout wholesale, 0.95 changes wardrobe colour, loses the setting and puts a SECOND PERSON in frame. Prompt+seed continuity alone held subject/wardrobe/location steady AND produced correctly varying framing including a genuine close-up. CONTINUITY_REFERENCE_ANCHORING now defaults to false; the tier stays implemented and verified as an FR-12 ablation condition. This is the one part of ADR-027 where the initial design intent was contradicted by measurement rather than refined by it. See PROJECT_ARCHITECTURE.md ADR-027 for full detail."

  - id: "ADR-028"
    title: "INTEG-002 FFmpeg half — WebVTT as the single caption format, hardsub as a separate file, and a caption/picture desync guard"
    date: "2026-08-12"
    summary: "Completes FR-9's post-processing pipeline (backend/src/services/ffmpegService.js — the file INTEG-002's roadmap row always named). Four decisions, all made to avoid a class of silent wrongness. (1) ONE SUBTITLE FORMAT, WebVTT: it is the only format an HTML5 <video><track> can display, and libass reads it happily, so the same single file drives both the in-browser caption toggle and the burn-in. Emitting SRT for FFmpeg plus VTT for the browser would have meant two near-identical files that can disagree. (2) HARDSUB IS A SEPARATE FILE, not a replacement: burned-in text cannot be turned off, and the clean master is what a frame-level image metric would have to score (FR-12/EVAL-004), so storyboard.mp4 is never modified — storyboard-subtitled.mp4 sits beside it and the UI offers both. Every step here is additive for the same reason assembly is non-fatal (ADR-027): by the time post-processing runs, the quota-expensive per-shot assets and the assembled video already exist and must not be put at risk by a poster frame. (3) CAPTIONS DESCRIBE THE ASSEMBLED TIMELINE, NOT THE AUTHORED ONE, and refuse to be written if they might not: shots that failed to generate are dropped from the video (they occupy no time), so cue boundaries are built from a newly-extracted remotionService.assembledShots() — the SAME filter renderStoryboard() uses, exported precisely so a second copy cannot drift — and the derived frame total is cross-checked against the durationInFrames Remotion actually reported. On a mismatch postProcess writes NO captions and reports why, because captions that drift look correct until someone watches to the end, which is worse than having none. This is not hypothetical: the verification run had a shot fail against a real Pollinations 500, and the captions correctly started at 00:00:00.000 with shot 2's text over a 180-frame video, not shot 1's over 300. (4) THE POSTER IS THE FIRST ASSEMBLED SHOT'S MIDPOINT, not the whole video's: shot one is the establishing shot, and its midpoint clears the opening frames of the camera move while still showing what the storyboard opens on — a midpoint of the whole timeline lands on an arbitrary later shot, often a close-up of a detail. Implementation notes: the subtitles filter is invoked with cwd set to the media directory and the file referenced by bare basename, because FFmpeg's filtergraph parser treats ':' and '\\' as syntax and a Windows absolute path needs two levels of escaping to survive it. Artifacts fail independently — a broken burn-in still leaves a usable .vtt. Live-verified end-to-end on the real stack plus a real Chromium (track readyState LOADED, cues parsed at exactly the right times) and 13/13 offline edge checks. See PROJECT_ARCHITECTURE.md ADR-028 for full detail."

  - id: "ADR-029"
    title: "Frontend visual identity re-grounded in the subject — a grading suite, not an AI-SaaS template"
    date: "2026-08-12"
    summary: "The team asked for deeper visual work (colour, animation, 3D, scroll/hover). The existing system already had the machinery -- reveal-3d, tilt-3d, hover-lift, shimmer, staggered entrances, reduced-motion guard -- so the gap was not a shortage of effects. It was that the identity (aurora orbs, glassmorphism, violet->cyan gradient, animated gradient headline, round numbered pills) is the most templated look in AI products today, and that the subject was invisible: a cinematography tool whose interface carried no cinematographic vocabulary at all. SELECTED: palette taken from colour grading itself -- amber #E8A33D against cyan #3FB8C4, the warm/cool axis -- on grade-room charcoal #14181D (dark = the suite, type in warm film-base off-white not pure white) and a cool lab white #E9EBEE (light = a light table, deliberately NOT a warm cream, itself an AI cliche). Three type roles replace one: Barlow Condensed display (slates and camera reports are condensed because the data is dense and the column narrow), Geist body, IBM Plex Mono for every number. Flat bordered 'plates' with a single hairline of the grade axis replace glass; film grain + lens vignette + a two-point key/fill wash replace the aurora orbs (grain is the emulsion, vignette is the lens -- properties of the medium, not decoration). One motion scale governs everything; the gradient survives in exactly three places rather than on every button. THE ONE BOLD ELEMENT is PipelineRail.tsx, justified on UX grounds not decorative ones: generation takes ~2 minutes that used to show a single percentage while four agents, RAG grounding, an intent check, a vision critic with bounded regeneration, and assembly all ran invisibly -- the worst possible trade for a viva, where the examiner watches a progress bar while the contribution runs unseen. The rail reports ONLY what the API returns: the orchestrator does not stream per-agent progress, so stages 1-3 resolve together as a group that is running rather than faking a sequential fill. Per-shot squares carry the critic's verdict, so a shot that generated but failed critique is visibly distinct from one that failed outright. Verified live on a real 4-shot run through all five stages; both themes pass WCAG AA (dark body 14.07:1 / muted 6.74:1 / amber 8.27:1; light body 14.92:1 / muted 5.18:1); no horizontal scroll at 375px; tsc -b and oxlint clean; reduced-motion still disables everything including the grain. Supersedes the violet->cyan system. StyleConfigurator's 'violet & cyan' option is untouched -- that is a palette the USER picks for their video, i.e. product content, not interface chrome. FOLLOW-UP same day (depth pass): the team kept the palette and asked for more colour and a more premium feel. Added a material system -- 1px top-edge highlight over two-layer downward shadows on every plate, three-channel hover (lift + border warmth + brand-tinted shadow), and top-lit primary buttons with a warm cast shadow. Found and fixed a leftover from the first pass: AnalysisPanel's score ring was still painting the RETIRED violet->cyan gradient with a hardcoded white track that broke in light theme. Ran the data colours through the dataviz validator against the real plate surfaces instead of eyeballing them, which caught two genuine defects: --success green sat at deltaE 8.9 from --accent cyan (below the 15 normal-vision floor) and any orange warning distinct enough to be useful collided with --destructive red at deltaE 4.1 for deuteranopes. Resolved by REMOVING colours: success aliased to the cool pole, status reduced to three validated hues (CVD deltaE 14.2 dark / 14.5 light, normal-vision 22.9/21.9), and every shot tick now carries a glyph so status is never colour alone. Added dedicated --mark-* tokens because a colour legible as 12px text and one that reads as a filled mark are different colours. Dimension meters use a single-hue sequential ramp, not a traffic-light rainbow. Second real bug found while verifying: the score count-up sat at 0 because browsers do not fire requestAnimationFrame in a background tab, so a panel mounting while document.hidden showed a confidently wrong score -- it now lands on the true value immediately when hidden or when motion is reduced. See PROJECT_ARCHITECTURE.md ADR-029."

  - id: "ADR-030"
    title: "EVAL-004 scoring design — stills over video, one fixed reference text, and both aggregations reported"
    date: "2026-08-13"
    summary: "Settles the two things ADR-024/ADR-025 deliberately deferred: the 'Generate output - same backend' step of Section 4.7's diagram, and the CLIPScore-style metric it feeds. Picked up because it is the only remaining roadmap task that does NOT need the paid video tier -- the question that prompted the session was 'what can be done without a paid video-generation API', and the answer is: the whole evaluation study, because CLIP scores FRAMES. FOUR DECISIONS. (1) STILLS, NOT VIDEO: the metric is frame-level by construction, and the Remotion pathway animates these same stills with a deterministic Ken-Burns move rather than synthesising new pixels, so for both available pathways the still IS the generated content -- not a compromise forced by the held video tier. (2) POLLINATIONS, NOT CLOUDFLARE: Cloudflare FLUX is the more reliable Tier 1 provider (DEMO-001: 4/4 vs 2/4) and was the first choice, but its free allocation of 10,000 neurons/day was already exhausted, leaving Pollinations as the only provider available at this scale without payment. (3) EVERY FRAME IS SCORED AGAINST THE ORIGINAL PROMPT, never against the text the condition itself produced -- this is the load-bearing decision, not the model choice. Scoring a frame against its own generating text would measure how faithfully Pollinations followed what it was handed (a property of the image model, not of the pipeline under test) and would reward verbosity in the enhancement step. The reference is therefore identical across conditions; the image seed is fixed per prompt and shared across conditions so seed luck cannot favour an arm; and the set is PAIRED, so neither arm is scored on an easier subset. (4) BOTH AGGREGATIONS OF CONDITION B ARE REPORTED -- mean-of-shots AND best-shot -- never one alone, because a naive reading would defame the multi-agent pipeline: B decomposes a prompt into shots that each depict PART of a scene, so against the full original prompt its individual frames score lower BY CONSTRUCTION. That is storyboarding working as intended, not a defect, and a lone mean-of-shots figure would misrepresent it as one. THE DEEPER LIMITATION, which must survive into the final report: CLIPScore reads one frame at a time and has no notion of a sequence, so it is structurally blind to what Condition B is actually FOR -- narrative decomposition, shot variety, cross-shot continuity (FR-7). A study reporting only this number would measure the baseline's strongest axis and none of the multi-agent pipeline's. The render prompt is composed identically for both conditions ('{camera}. {description}.') and deliberately does NOT reproduce continuityPrompt.js's production composition, which prepends B's world_state as a labelled block -- maintaining a Python copy of that JS is exactly the drift ADR-028 refused. Note the bias direction: world_state is a genuine product of the multi-agent pipeline with no Condition A equivalent, so excluding it UNDERSTATES Condition B, making any measured B win a floor rather than a ceiling. Implementation: evaluation/media.py (disk-cached, rate-paced frame generation), evaluation/alignment.py (CLIPScore = 2.5*max(cos,0) on clip-ViT-B-32), evaluation/run_scoring.py (runner -> results/eval004_scores.json + results/eval004_comparison.md). Local CLIP is the narrow exception ADR-015 already granted to sentence-transformers+torch -- a one-off scoring pass, never in the request path. 38/38 offline edge checks passed; writing them found two real defects (the minimum-size guard sat inside the Pollinations fetch, so another fetch could cache a non-image, and a cached error page is indistinguishable from a real frame on a later run; and spacy_summary indexed record keys directly). Generated frames ARE committed, unlike the gitignored FAISS index: the index rebuilds deterministically from a committed corpus, a hosted diffusion provider guarantees nothing, so these frames are the study's only durable evidence. Provider pacing was MEASURED, not assumed: unpaced ~100s/frame (nearly all retry backoff), 5s spacing ~50s/frame still 429ing, 15s spacing 0 rate-limits in 6 consecutive requests; the residual 1.9-31.8s per request is the provider's own queue, which neither pacing nor concurrency removes. See PROJECT_ARCHITECTURE.md ADR-030."

  - id: "ADR-031"
    title: "Clarification question count scales with how under-specified the prompt is"
    date: "2026-08-13"
    summary: "Observed in use: the clarification step asked TWO questions every time, whether the prompt was 'a dog' or a fully-formed scene. MAX_QUESTIONS was a hard constant and generate_questions ended with questions[:2] -- a slice that silently discarded the analyzer's OWN evidence, since FR-1 emits one flag per below-threshold dimension and 'a dog' produces four flags naming four distinct gaps. The reverse failure was equally real: a prompt with one genuine gap still got two questions, the second necessarily padding. SELECTED: budget computed from the analysis -- one question per DISTINCT flag (a flag IS an unresolved gap; asking past the gaps produces filler; de-duplicated because contradictory_descriptors is appended once per contradicting pair), plus one if the prompt is under 12 words (the analyzer can only flag what was written, never detail that was never expressed), plus one if the overall score is under 40 (weak everywhere rather than weak in one place), clamped to 6. Zero flags still means zero questions AND no LLM call. overall_score is threaded from the backend as an OPTIONAL field so older callers keep working. THE PROMPT-SIDE CHANGE MATTERS AS MUCH AS THE COUNT: the old instruction said 'ask AT MOST 2' -- a ceiling, which a model satisfies with two generic questions -- and now says 'ask EXACTLY N' plus explicit quality rules: one gap per question and never two questions a single answer would settle; only things the camera can show, not intent or audience or purpose; NEVER yes/no ('Is it at night?' gains one bit; 'What time of day, and what is the main light source?' gains a usable answer); and two or three concrete example directions in parentheses, because a user who wrote a vague prompt often does not yet know the options. build_brief was tightened in the same pass: the clarified prompt is the ONLY thing the rest of the pipeline reads, so it must carry every answer, and it MAY add specificity implied by the answers (light from a stated time of day) but MUST NOT invent characters, plot, places or dialogue -- inventing there is worse than leaving a gap, because everything downstream treats it as user intent. Still a SINGLE round, which is what guarantees termination (proposal 6.2) -- a vaguer prompt gets a LONGER round, never a second one. MEASURED against real spaCy: 'a dog' (score 15, 4 flags) 2 -> 6 questions, 'a man walks' (score 35, 3 flags) 2 -> 5, while an 83-scoring rich prompt stays at 0 and skips the step entirely. Live-verified against real Groq: 'a dog' now returns six distinct non-overlapping questions (action, location, breed/appearance, time-of-day and light, mood, other subjects), each with worked examples, where the old build asked two generic ones. 110/110 tests pass (19 new). No frontend or API-shape change needed -- questions is still string[] and ClarificationChat.tsx already rendered whatever length it received. Cost is flat: same one LLM call, only a longer response. See PROJECT_ARCHITECTURE.md ADR-031."

  - id: "ADR-032"
    title: "Narration as measured beats — the video is fitted to the audio, not the reverse"
    date: "2026-08-13"
    summary: "Two linked team questions: should a video get a full script ('what happens 0-1s, 1-2s...'), and do video models already produce voiceover? The second was settled by checking: EVERY model in this project's reach is SILENT -- Runway, Pika, Luma, Kling, Stable Video Diffusion and the Hugging Face text-to-video models all return picture only; native synchronised audio exists in Veo 3 and Sora 2, neither in PROVIDER-001's tiers. So voiceover is added afterwards, raising the two hard questions: what should it say, and how does it stay in sync. BEATS, NOT SECONDS: a fixed one-second grid fails twice. Nothing can consume it (Remotion holds ONE still per shot under a Ken-Burns move, image providers return one still per shot, text-to-video models take one prompt per clip rather than instructions addressed to t=3s -- keyframes are the finest control that exists anywhere). And the unit is wrong: a 4-second shot holds about two narrative beats, not four, so equal slices invent boundaries that do not exist and force padding. A BEAT -- one continuous thing happening, one line of narration over it -- is the smallest real unit; a per-second table is a VIEW renderable FROM beats, and that direction is sound where the reverse is not. WHAT IT SAYS: never inferred from generated pixels. A Narrator agent writes narration from the storyboard the pipeline already has, so picture and voice share one source -- the same shape as ADR-028's subtitles. HOW IT STAYS IN SYNC: the video is fitted to the audio. Constraining narration to an authored duration at some words-per-second budget drifts, because speaking rate varies with voice, punctuation and words, and error accumulates until the voice describes the wrong picture. Instead each line is synthesised FIRST, its real length MEASURED, and the shot's duration_s set to the sum of its beats. Remotion composes an AUTHORED timeline -- framesFor(shot) takes duration as an INPUT -- so the shot becomes exactly as long as the speech it carries and drift is structurally absent rather than corrected. This required NO timing change in the composition: framesFor already read duration_s. The measurement is the synthesiser's own -- Edge TTS streams SentenceBoundary metadata with offset and duration in 100ns ticks, so spoken length is reported, not decoded or estimated; below a floor it RAISES rather than guessing, since a fallback estimate reintroduces exactly the drift being removed. PROVIDERS, all three checked live 2026-08-13: Edge TTS is Tier 1 (hosted, so ADR-015 holds -- nothing runs on the dev machine -- free, no key, no signup). Cloudflare is Tier 2: @cf/myshell-ai/melotts and @cf/deepgram/aura-1 both exist (schema-validation errors, not 404s) but share one 10,000 neuron/day allocation with image generation, already exhausted by EVAL-004's frames. Groq is OUT: playai-tts returns 'has been decommissioned' and its live catalogue now holds only Whisper, which is speech-to-TEXT. BACKEND WIRING (same day): narrationService.attachNarration runs AFTER per-shot generation and BEFORE assembly -- after, because narration covers only shots that survived (a failed shot is dropped from the video and occupies no time, so narrating it would push every later line ahead of its picture -- ADR-028's guard, and real provider 500s drop shots on ordinary runs); before, because it REPLACES each narrated shot's duration_s with the measured sum of its beats. Audio lands in /media/{id}/narration-{shot}-{beat}.mp3; beats persist on the shot subdocument so GET /api/jobs/:id returns them with shots for free; remotionService maps them across explicitly (a field-by-field construction, not a spread, so beats had to be carried deliberately and their URLs made absolute like the stills). Non-fatal at every level like ADR-027/ADR-028: on failure shots keep authored durations and the video renders silently, with narration_error explaining why. Captions now follow BEAT boundaries when a shot is narrated -- a caption saying something other than the voiceover would be worse than none. A REAL ROUNDING DEFECT was found and fixed while wiring: rounding each beat to frames INDEPENDENTLY lets a shot's beats sum to a different frame count than the shot itself (two 1.11s beats -> 33+33=66 frames; their 2.22s shot -> 67). One frame is enough to push an Audio clip past the end of its Series.Sequence, desynchronise captions from speech, and -- worst -- corrupt the frame total ADR-028's desync guard checks against Remotion's actual render, silently disabling the check that exists to catch exactly this. Both consumers now derive boundaries by CUMULATIVE rounding within the shot, clamped to the shot's own frame count. VERIFIED: 18 narration unit tests (128/128 suite), 10/10 caption-builder checks including that independent rounding genuinely WOULD have disagreed and that total frames are unchanged with narration on or off, 14/14 narration-service checks including that un-generated shots are never narrated and that failure leaves authored durations untouched, plus real end-to-end synthesis through the real endpoint (3.212/2.487/2.462s onto a contiguous 8.162s timeline against 8.162s of measured speech). NOT YET DONE: no full-stack render with sound has been produced -- that needs the live stack. See PROJECT_ARCHITECTURE.md ADR-032."

