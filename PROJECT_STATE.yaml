blockers:
  - id: "ENV-001"
    problem: "The WSL2 Redis service is unreachable from Windows, so every POST /api/storyboards/:id/generate returns 500"
    cause: "Redis inside WSL2 binds 127.0.0.1 within the WSL network namespace (/usr/bin/redis-server 127.0.0.1:6379, from /etc/redis/redis.conf) and WSL2's localhost forwarding is not currently relaying it. Confirmed from Windows: localhost:6379, 127.0.0.1:6379 and the WSL IP 172.20.111.119:6379 all refuse. The committed default REDIS_URL=redis://localhost:6379 therefore cannot connect, and Bull fails with an ioredis 'Reached the max retries per request limit (which is 20)' error."
    impact: "High when it bites, and it bites silently — nothing else in the stack reports a problem, so it presents as a generation bug rather than a missing service."
    workaround_used: "A second Redis instance inside WSL on port 6380 bound to 0.0.0.0 (redis-server --port 6380 --bind 0.0.0.0 --protected-mode no --daemonize yes), immediately reachable from Windows; INTEG-002's end-to-end verification ran against it. backend/.env was then restored to its committed value, so the repo is unchanged and the defect is still live. `redis-cli shutdown` does not help — the service is supervised and returns with the same bind."
    next_action: "Needs the team, because it requires sudo (this agent does not run interactive sudo — same pattern as BLOCK-001's WSL2 setup). Either (a) sudo-edit /etc/redis/redis.conf to `bind 0.0.0.0` and restart the service, or (b) run `wsl --shutdown` from Windows to rebuild WSL's localhost-forwarding relay. Re-test with `(echo > /dev/tcp/localhost/6379)`."
    found_on: "2026-08-12"
    status: "RESOLVED 2026-08-12 — the team applied the /etc/redis/redis.conf bind change (redis now listens on 0.0.0.0 and is reachable from Windows, confirmed by a live port check). Kept in this list rather than moved to resolved_blockers because the same WSL-loopback trap applies to ANY service started inside WSL: ai-service must likewise be launched with `uvicorn --host 0.0.0.0`, which is now a documented pre-flight step in DEMO_RUNBOOK.md."
# BLOCK-001 (spaCy blocked by Windows Smart App Control) was found and
# resolved on 2026-08-10 — see resolved_blockers below and
# PROJECT_PROGRESS.md Section 9 for the full record.

