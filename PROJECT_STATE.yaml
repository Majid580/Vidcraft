ng; EVAL-002/003/004 are next. Prior update, retained below: Claude (Sonnet 5) — INTEG-001 real full-stack E2E confirmation run: started all four real services (ai-service via WSL2 uvicorn, backend via node src/app.js, real local MongoDB, real WSL2 Redis) plus the frontend Vite dev server, then drove the actual browser UI through the full pipeline with no stubs/mocks/demo-mode anywhere. Confirmed the two previously-isolated INTEG-001 halves (backend HTTP integration test; frontend demo-mode run) genuinely connect: prompt analysis -> real Groq-backed LangGraph storyboard generation grounded in the real RAG-003 index -> real async Bull job -> real Remotion rendering -> real MP4s played back correctly in-browser (verified via each <video> element's readyState/duration/dimensions, not just that the request returned 200). Zero console errors. Marked INTEG-001 VERIFIED (see its task entry below) — this was the last explicitly-flagged remaining item for that task. Surfaced one non-blocking issue in the process, recorded as R-14 in PROJECT_ARCHITECTURE.md Section 24 and root-caused same session: POST /api/prompts / POST /api/storyboards each fired twice — first suspected as a StrictMode frontend bug, corrected after the team clarified a team member had separately opened the same dev frontend and clicked Generate while this run used the same dev backend concurrently, so two independent real clients raced, not one click double-firing. The resulting duplicate storyboard-creation race (one branch hit a Mongoose VersionError, the other self-healed) is still a real, worth-hardening dedup gap, just from a mundane concurrent-access cause rather than a client defect. Did not block the confirmation run's success criterion. Next: EVAL-001 (curate the 50-prompt test set) is now the top unblocked item; R-14 hardening is a good secondary pickup. Prior update, retained below: Claude (Opus 4.8) — INTEG-001 frontend slice: wired the UI to the async generation backend. handleGenerate now chains storyboard creation straight into POST /api/storyboards/:id/generate, then polls GET /api/jobs/:id every 1.5s (recursive setTimeout in App.tsx, cancelled on completion/reset/unmount); StoryboardView renders a generation progress bar, per-shot status pills, and the finished asset_urls from /media (img for stills, <video> for .mp4), with a Regenerate button. lib/api.ts gained startGeneration()/getJob() (+ a GET helper), lib/types.ts gained GenerateResponse/JobStatus + Shot.asset_url/error/on_hold, lib/demo.ts simulates the same poll loop client-side (demoStartGeneration/demoGetJob). Verified in-browser via demo mode (identical App poll + StoryboardView render code to the real path; the real endpoints were already verified 11/11 in the backend integration test): happy path (3 shots -> Done, progress 0->100, 3 assets rendered, Regenerate/Create-another shown) and the video-held path (huggingface -> 3 shots On hold + amber message, 0 assets, 100%), zero console errors; tsc -b + oxlint clean. Files: frontend/src/App.tsx, frontend/src/components/StoryboardView.tsx, frontend/src/lib/{api,types,demo}.ts. Closes the prompt->rendered-output loop in the UI for the image/Remotion pathways (video stays held). REMAINING for full INTEG-001: a real full-stack end-to-end confirmation run, POST /api/storyboards async, optional WebSocket push. Prior update, retained below: Claude (Opus 4.8) — INTEG-001 async generation backend (ADR-023): wired the BACKEND-003 Bull/Redis queue for real. POST /api/storyboards/:id/generate is now genuinely async — enqueues one per-storyboard job and returns 202 {jobId,storyboardId,status}; the in-process worker (backend/src/queues/generationQueue.js) renders/generates each shot via the unchanged generationService adapters, persisting per-shot status/asset_url/error to Mongo incrementally and reporting job.progress() 0-100; new GET /api/jobs/:id (backend/src/routes/jobs.js) polls state/progress/shots; new Storyboard.job_id enables in-flight dedup + reconnect. Resolves the ADR-014/ADR-021 synchronous stopgap for /generate. Verified via an HTTP integration run against real Express+Bull+Redis(WSL2)+Mongo (only per-shot generation stubbed for speed/determinism, since the adapters were already verified in ADR-021): 202->active->completed, progress 0/33/67/100, three shot outcomes (completed+asset_url / on_hold / failed+error), in-flight dedup returns the same job, GET /api/jobs/<bogus> and POST /generate on an unknown storyboard both 404 — 11/11 checks, deterministic across 3 runs. Files: backend/src/queues/generationQueue.js (real processor), backend/src/routes/storyboards.js (async /generate), backend/src/routes/jobs.js (new), backend/src/models/Storyboard.js (+job_id), backend/src/app.js (+jobs route), .gitignore (+*.rdb). Backend-only — the frontend never called /generate, so no UI change; wiring the frontend to call/poll/render is the remaining INTEG-001 slice (see next_tasks). Prior update, retained below: Claude (Opus 4.8) — voice-to-text prompt input (ADR-022): implemented the standing team request — a press-to-talk mic on the prompt composer that streams transcribed speech into the prompt box — via the browser-native Web Speech API rather than a hosted Groq whisper-large-v3 endpoint, because interimResults streams words live as you speak (a record-then-POST flow can't) and it honors ADR-015's no-local-heavy-compute rule (Chrome/Edge transcribe on the vendor cloud — zero PC load, no torch/whisper) at zero backend/key/cost and without touching the Groq free-tier quota. Built as two hooks + one component: useSpeechRecognition.ts (raw recognizer wrapper, {supported,listening,transcript,interim,error,start,stop,reset}), useDictation.ts (binds it to one field, owns the press-and-hold gesture — pointer capture + keyboard Space/Enter hold for accessibility — and merges speech after existing text via mergeSpoken), and DictationMic.tsx (self-contained mic button, renders nothing when unsupported). Interaction is true press-and-hold (walkie-talkie: talk while held, release to stop), not toggle. Wired into TWO places: PromptComposer.tsx (mic in the prompt textarea + pulsing Listening indicator + friendly permission/no-speech error copy) and ClarificationChat.tsx (one mic beside EVERY answer box). Graceful degradation hides the mic on Firefox/older Safari. tsc -b + oxlint clean. Live-verified in the in-app Chromium: composer mic renders as Hold-to-dictate/Hold-to-talk with padding at 56px; demo-mode flow reached ClarificationChat with exactly one Hold-to-talk mic per answer; pointer + keyboard hold gestures fired without crashing; the mic-blocked sandbox exercised the not-allowed path (friendly error shown, aria-pressed reset to false, no stuck listening state); served module verified clean, no Vite error overlay (true streaming needs a real mic, unavailable here). Additive team feature outside the 35-task roadmap (like ADR-021's single-image mode), so the verified-task count is unchanged. See next_tasks for what's next (INTEG-001 real async queue wiring; BACKEND-005 video stays a deliberate hold). Prior update, retained below: Claude (Sonnet 5) — ADR-021: per direct team instruction, wired real per-shot generation for the free image providers (pollinations/cloudflare, plus remotion) via new generationService.js and POST /api/storyboards/:id/generate, while deliberately holding huggingface (video) — not attempted, not retried — pending a paid API key. Also added an additive single-image mode (POST /api/images + frontend mode toggle) after the team asked whether image-provider storyboards should collapse to one image; clarified that's a separate, new capability rather than a change to the existing multi-shot storyboard/FR-9/evaluation-study design, and built it as such. Live-verified end-to-end (backend curl round-trips + a full real browser session covering both single-image and multi-shot storyboard flows, zero console errors). BACKEND-005 remains IN_PROGRESS (video tier intentionally unmet) — see next_tasks for what's actually next: voice-to-text prompt input. Prior update, retained below: AI-008 (sentence-similarity intent check + retry loop): ai-service/orchestrator/similarity.py's compute_similarity() adds a 4th LangGraph node (screenwriter -> cinematographer -> intent_check -> producer -> END) that embeds the clarified prompt and the storyboard's joined shot descriptions with the existing RAG-001 all-MiniLM-L6-v2 encoder and compares them via cosine similarity; below STORYBOARD_SIMILARITY_THRESHOLD (0.35, ADR-018) the graph routes back to the Screenwriter, bounded by MAX_STORYBOARD_RETRIES (2) attempts tracked via a new attempt_count state field, after which it finalizes the last attempt rather than failing the request (mirrors FR-8's critic-loop exhaustion behavior). 5 new offline tests (71/71 total pass); live-verified end-to-end in WSL2 against the real Groq API + real embedder — a normal run passed on the first attempt (real similarity ~0.7, well above the 0.35 default), and a forced impossible threshold (1.5) exercised the retry ceiling for real, logging attempt 1/3 -> retry, 2/3 -> retry, 3/3 -> finalize, confirming the bounded loop actually terminates rather than hanging. Completes the RAG-001..003 + AI-007 + AI-008 orchestrator vertical (FR-3/FR-4) fully. Then PROVIDER-001 (ADR-019): selected AND live-validated Tier 1 free providers — Pollinations.ai for image (no account, live-verified via curl) plus Cloudflare Workers AI as a validated alternate image provider (real account+token confirmed live, real text-to-image catalog of 287 models), and Hugging Face for video (token live-verified via whoami — this is the actual video provider, not a fallback: once real Cloudflare credentials existed, its live catalog was checked directly and has NO video-generation model at all, correcting the initial research-based pick same-day before any code was built on it) — plus a Tier 2/3 paid gateway (fal.ai, selected but deliberately not wired up