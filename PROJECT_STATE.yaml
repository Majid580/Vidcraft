        priority: "MEDIUM"
        dependencies: []
        verified_on: "2026-08-12"
        verified_by: "Claude (Sonnet 5) — 9 new offline pytest tests pass in ai-service/.venv-wsl (exact-50 count, unique ids, unique prompt text, both complexity values well-represented, >=10 diverse genres with no thin category, every item carries >=2 tags, every prompt >=40 chars, loader raises EvaluationDatasetError on a missing file); full ai-service suite re-run afterward to confirm zero regressions -- 76/76 total pass (71 prior + 9 new − 4 retired Producer-agent tests removed by ADR-020, which happened after the 71-count was last recorded)."
        note: "ai-service/evaluation/dataset/: prompts.json (50 original, license-clean scene-description prompts — never copied from any external source), loader.py (load_prompts() — strict validation into {id, prompt, complexity, genre, tags}, mirroring rag/corpus/loader.py's CorpusError pattern via a new EvaluationDatasetError), __init__.py, README.md. Mirrors the RAG-002 corpus-curation template exactly (same JSON + validating-loader + offline-pytest shape). Satisfies the roadmap's 'covering single-shot and multi-shot ideas' criterion via a complexity field: 26 single-beat (one static scene) / 24 multi-beat (2+ visual beats), tagged explicitly rather than left implicit. 15 distinct genres, 3-4 prompts each, so no single theme dominates the study. Deliberately moderate descriptive detail per prompt (not maximally vague, not maximally detailed) so EVAL-002 (baseline) vs EVAL-003 (multi-agent) has room to show a real difference rather than the prompt quality alone determining the outcome. Curation only — no evaluation-runner scripts, no scoring, no generation; that's EVAL-002/003/004."
