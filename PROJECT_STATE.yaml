        note: "Uses a real LangGraph StateGraph (ADR-001), not a hand-rolled pipeline — currently a single 'screenwriter' node, structured so Cinematographer (AI-007) and Producer/Router (AI-005) can be added as further nodes in the same graph. Per ADR-012, the Screenwriter drafts a best-effort camera value per shot and hardcodes pathway to 'remotion' as documented placeholders for AI-005/AI-007 to overwrite — this is not Cinematographer/Producer logic. Output-shape validation (ScreenwriterOutputError) rejects malformed LLM output (wrong shot count, missing fields) rather than silently passing it through. ffprobe itself wasn't on PATH in this shell (known pre-existing PATH quirk, see SETUP-001 notes); the rendered MP4 was instead confirmed via file size + ISO Media container magic bytes. Verification artifacts (temp script, output MP4) were cleaned up, not committed."
      - id: "AI-005"
        name: "LangGraph orchestrator: Producer/Router agent"
        status: "VERIFIED"
        priority: "HIGH"
        dependencies: ["AI-004"]
        verified_on: "2026-08-10"
        verified_by: "Claude (Sonnet 5) — 4/4 new pytest tests pass (26/26 total) with LLM mocked; live end-to-end call to POST /storyboard/generate against the real Groq API with a prompt mixing an explicit photorealistic shot and two stylized/animated shots correctly split pathways 1 external_api / 2 remotion, per the ADR-013 heuristic"
        note: "Added as a second node in the same LangGraph StateGraph (screenwriter -> producer -> END), not a separate pipeline, per ADR-001. Overwrites the AI-004/ADR-012 hardcoded 'remotion' placeholder with a real per-shot routing decision. Per ADR-013, shots routed to external_api cannot currently be rendered — the adapter layer (BACKEND-005) and concrete providers (PROVIDER-001) don't exist yet; this is forward-looking routing logic only."
      - id: "AI-006"
        name: "Groq + fallback LLM integration"
        status: "VERIFIED"
        priority: "HIGH"
        dependencies: ["AI-004"]
        verified_on: "2026-08-10"
        verified_by: "Claude (Opus 4.8) — 46/46 pytest pass (11 new in tests/test_llm.py, providers mocked); live end-to-end from WSL2 (.venv-wsl): (1) real Groq primary via llm.complete_json returned {'city':'Tokyo'}; (2) with the Groq primary forced to raise APIConnectionError, llm.complete_json transparently fell through to the REAL hosted fallback API (second Groq model llama-3.1-8b-instant on the same free key) and returned {'city':'Rome'}, logging the documented fallback warning"
        note: "Fallback lives entirely in the llm/ layer behind the unchanged complete_json(system,user,temperature)->dict contract, so AI-003/004/005 and all their tests are untouched. llm/completion.py tries groq_complete_json (llm/groq_client.py) first and, on a _FALLBACKABLE failure (GroqConfigError | groq.APIError [connection/rate-limit/5xx] | json.JSONDecodeError), calls fallback_complete_json (llm/http_llm_client.py). Per ADR-015 the fallback is a HOSTED OpenAI-compatible /chat/completions endpoint (httpx, no new dep) — NEVER a local model: the user explicitly ruled out on-device LLM/heavy compute (slows the dev machine, hurts UX). An earlier Ollama/local-llama3 implementation was written then removed this same session after a cold-start warm-up took >120s, confirming the concern. Defaults point at a second Groq model on the same GROQ_API_KEY (different per-model rate bucket vs the 30 req/min free-tier cap, zero cost, no extra signup); FALLBACK_LLM_BASE_URL/API_KEY/MODEL override to any independent provider (OpenRouter/Together/Gemini-OpenAI-compat/OpenAI). LLM_FALLBACK_ENABLED=false makes Groq failures fatal (raises LLMError). Non-provider errors (e.g. a caller TypeError) propagate rather than being masked by a fallback. Concrete second Groq provider decision recorded as ADR-016; hosted-only policy as ADR-015."

