  repository_reality: "Git repo pushed to https://github.com/Majid580/Vidcraft (main branch). backend/ is a working Express app (health-check verified) with real REST routes (BACKEND-004: POST /api/prompts, POST /api/prompts/:id/clarify, POST /api/storyboards, GET /api/storyboards/:id) that round-trip through a real MongoDB connection (Prompt/Storyboard Mongoose schemas, native Windows service, not Docker — see resolved_blockers) AND a real HTTP call to ai-service (aiServiceClient.js) — AI-002/003/004/005 are no longer only reachable directly on the ai-service port. Centralized error handling (middleware/errorHandler.js) and request validation (middleware/validation.js) are wired in app.js. backend/ can also invoke real Remotion renders (remotionService.js), not yet wired into the storyboard routes (that's INTEG-001). ai-service/ is a working FastAPI app run from WSL2 (health-check verified, per ADR-008) and exposes: (1) POST /analyze (AI-002, FR-1 five-dimension prompt scorer), (2) POST /clarify/questions + POST /clarify/resolve (AI-003, FR-2 clarification agent, real Groq API calls, unit-tested with a mocked LLM and live-verified end-to-end including a re-analysis showing score improve from 33 to 72), and (3) POST /storyboard/generate (AI-004+AI-005, a real LangGraph StateGraph — Screenwriter node decomposes a clarified prompt into a 3-5 shot storyboard, Producer/Router node then assigns each shot's pathway per the ADR-013 photorealism heuristic; live-verified end-to-end including a mixed prompt that correctly split 1 external_api / 2 remotion shots, and confirmed the remotion-routed output chains directly into REMOTION-003's renderShot()). frontend/ is a working Vite/React/Tailwind/shadcn-ui app (verified rendering in-browser). remotion/ has 4 compositions plus a programmatic render-shot.mjs entry point with shot->composition selection + documented fallback, verified end-to-end from the backend. The orchestrator's Cinematographer node doesn't exist yet (AI-007) — camera framing is still a Screenwriter best-effort draft, not RAG-grounded. Shots routed to external_api cannot currently be rendered (BACKEND-005/PROVIDER-001 not implemented). A Bull.js/Redis queue now exists (BACKEND-003, backend/src/queues/generationQueue.js, Redis running inside WSL2) but nothing enqueues real jobs onto it yet — POST /api/storyboards is still synchronous, deviating from the PROPOSED async 202 shape — see ADR-014. Wiring the queue into that route (or a generation route) is INTEG-001/BACKEND-005 territory, not done here. A RAG vector-index scaffold now exists (RAG-001, ai-service/rag/{index,embedder}.py): a FAISS IndexFlatIP + JSON metadata sidecar wrapped by VectorIndex, with the real all-MiniLM-L6-v2 encoder (384-dim, cosine) lazily loaded, live-verified end-to-end (empty-index query returns [] gracefully; a small cinematography corpus embeds, ranks a semantic query sensibly, and survives a save/reload round-trip). It is an empty scaffold only — no curated corpus is loaded (RAG-002), nothing is embedded into a persisted production index yet (RAG-003), and the Cinematographer node that will query it (AI-007) does not exist; MongoDB metadata sync (Section 10 embeddings collection) is deferred to RAG-003, with the JSON sidecar as the interim store. The LLM layer (ai-service/llm/) is now fallback-aware (AI-006): the single complete_json(system,user,temperature)->dict entrypoint (llm/completion.py) calls Groq primary (llm/groq_client.py) and, only on a provider failure (429/5xx/connection/no-key/bad-JSON), transparently falls back to a HOSTED OpenAI-compatible endpoint (llm/http_llm_client.py) — per ADR-015 never a local model (the user ruled out on-device LLM/heavy compute for UX/resource reasons; an Ollama draft was written and removed this session). Default fallback is a second Groq model (llama-3.1-8b-instant) on the same free key (ADR-016), env-overridable to any independent provider. All of AI-003/004/005 gained this resilience for free since the contract was unchanged. NOTE (ADR-015 follow-up): RAG-001's embedder still runs local sentence-transformers+torch, which contradicts the hosted-only policy — RAG-003 should move embeddings to a hosted API."
