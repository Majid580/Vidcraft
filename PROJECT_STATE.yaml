decisions:
  - id: "ADR-001"
    title: "LangGraph for multi-agent orchestration"
    date: "2026-08-10"
    summary: "Chosen over a hand-rolled if/else pipeline for explicit, inspectable control flow and bounded retry cycles."
  - id: "ADR-002"
    title: "Groq as primary LLM, secondary provider as fallback only"
    date: "2026-08-10"
    summary: "Minimizes compounding latency across multiple sequential agent calls per generation."
  - id: "ADR-003"
    title: "Dual-mode generation: Remotion (guaranteed) + tiered external APIs (best-effort)"
    date: "2026-08-10"
    summary: "Keeps the system demonstrable at zero cost; avoids an unsupportable guaranteed-consistency claim on the API pathway."
  - id: "ADR-004"
    title: "FAISS + MongoDB metadata instead of a managed vector database"
    date: "2026-08-10"
    summary: "Simplicity; avoids adding another managed/paid dependency."
  - id: "ADR-005"
    title: "Bounded retry loops everywhere (default max 2)"
    date: "2026-08-10"
    summary: "Predictable cost and demo timing; never unbounded self-refinement."
  - id: "ADR-006"
    title: "Evaluation study uses an independent metric, not the triggering spaCy heuristic"
    date: "2026-08-10"
    summary: "Avoids circularity between the enhancement trigger and the evaluation metric."
  - id: "ADR-007"
    title: "Scope deliberately trimmed (single TTS provider, small tiered API set)"
    date: "2026-08-10"
    summary: "Keeps the project achievable for a 4-person team within the timeline."
  - id: "ADR-008"
    title: "ai-service runs inside WSL2 (Ubuntu), not native Windows Python"
    date: "2026-08-10"
    summary: "Resolves BLOCK-001 (spaCy blocked by Windows Smart App Control) without disabling a system security feature."
  - id: "ADR-009"
    title: "Remotion lives in a dedicated top-level remotion/ directory, not inside ai-service/"
    date: "2026-08-10"
    summary: "Remotion is a Node/React toolkit; keeps it isolated from the Python ai-service, mirroring frontend/backend separation."
  - id: "ADR-010"
    title: "FR-1 scoring formula: equal-weight average, 40-point flag threshold"
    date: "2026-08-10"
    summary: "overall_score is the unweighted mean of the 5 dimension scores; any dimension below 40/100 raises its corresponding flag+suggestion. Simplest defensible default absent a specified formula (R-12); documented here rather than left as a silent hard-coded choice. Per-dimension heuristics (subject-clarity from nsubj/nsubjpass presence, action-specificity from a vague-verb lemma list, environment-detail from GPE/LOC/FAC NER + locative prepositions + time-of-day words, visual-richness from adjective density, temporal-coherence from temporal-marker presence + finite-tense mixing) live as inline comments in ai-service/analyzer/scoring.py. Revisit if the curated 50-prompt test set (EVAL-001) shows systematic miscalibration."
  - id: "ADR-011"
    title: "Concrete Groq model selected: llama-3.3-70b-versatile"
    date: "2026-08-10"
    summary: "Section 11.2 left the specific Groq model TBD. Queried the live Groq /models endpoint, selected llama-3.3-70b-versatile as the GROQ_MODEL default (env-overridable), confirmed via a live JSON-mode structured-output smoke test. Chosen over llama-3.1-8b-instant for stronger structured-reasoning quality on the orchestrator agents' tasks. The fallback-provider choice was later resolved by ADR-015 (hosted-only, never local) + ADR-016 (default = second Groq model llama-3.1-8b-instant)."
  - id: "ADR-012"
    title: "Screenwriter drafts full shot shape (camera + pathway placeholder), not just narrative fields"
    date: "2026-08-10"
    summary: "AI-004's Screenwriter agent drafts a best-effort camera value per shot and hardcodes pathway to 'remotion', both explicitly documented as placeholders for Producer/Router (AI-005) and Cinematographer (AI-007) to overwrite — lets the storyboard already flow into REMOTION-003 today instead of sitting unusable until those agents exist."
  - id: "ADR-013"
    title: "Producer/Router pathway heuristic: photorealism signal maps to external_api, else remotion"
    date: "2026-08-10"
    summary: "AI-005's Producer/Router agent sends each shot + world_state to Groq and asks whether the shot's description/style_tokens explicitly call for photorealistic/live-action output; if so, pathway=external_api, else remotion. Live-verified: a mixed prompt correctly split 1 external_api / 2 remotion. external_api-routed shots can't actually be rendered yet — BACKEND-005 (adapter layer) and PROVIDER-001 (concrete providers) don't exist yet; this is forward-looking routing only."

  - id: "ADR-014"
    title: "POST /api/storyboards is synchronous (201/completed), not the PROPOSED async 202/processing shape"
    date: "2026-08-10"
    summary: "PROJECT_ARCHITECTURE.md Section 9.2 proposed POST /api/storyboards return 202 {storyboardId, status: 'processing'} for an async job. BACKEND-004 implements it as a synchronous call instead — it awaits ai-service's /storyboard/generate directly and returns 201 with the completed storyboard — because BACKEND-003 (the Bull.js queue) doesn't exist yet, and faking a 'processing' status for a call that's actually already finished would be misleading rather than honest scaffolding. Revisit once BACKEND-003 lands: the route should move the ai-service call into a queued job and genuinely return 202/processing, with GET /api/storyboards/:id reporting real progress."
  - id: "ADR-015"
    title: "No local LLM / heavy on-device compute — all inference goes through hosted APIs"
    date: "2026-08-10"
    summary: "The user directed that no LLM or heavy work run locally: on-device inference consumes dev-machine resources and gives slow responses, degrading UX. AI-006's fallback was therefore implemented as a hosted OpenAI-compatible /chat/completions endpoint, not the initially-drafted local Ollama/llama3 provider (which was removed the same session after a cold-start warm-up exceeded 120s, confirming the concern). The policy is FIRM for the LLM path. SCOPE NUANCE (decided 2026-08-10): the user chose to KEEP RAG-001's local sentence-transformers+torch embedder (and AI-008's similarity check) for now and shift embeddings to a hosted API only IF it actually slows the machine down — so that migration is a DEFERRED, performance-contingent follow-up, not an urgent inconsistency. (Groq has no embeddings endpoint, so it would need a separate hosted embeddings provider.)"
  - id: "ADR-016"
    title: "Fallback LLM default: a second Groq model via the OpenAI-compatible endpoint"
    date: "2026-08-10"
    summary: "Section 13/.env.example left FALLBACK_LLM_PROVIDER TBD. AI-006 defaults it to a second Groq model (llama-3.1-8b-instant) reached through Groq's OpenAI-compatible base (https://api.groq.com/openai/v1) on the same free GROQ_API_KEY — zero cost, no extra signup, and a different per-model rate bucket than the primary llama-3.3-70b (directly mitigating the 30 req/min free-tier 429s). The client is provider-agnostic: FALLBACK_LLM_BASE_URL/API_KEY/MODEL override to any independent OpenAI-compatible host (OpenRouter, Together, Google Gemini's OpenAI-compat endpoint, OpenAI) with no code change. Caveat: a same-provider fallback does not cover a full Groq outage — revisit if an independent secondary is warranted (relates to R-8/R-13)."
  - id: "ADR-017"
    title: "RAG-003 keeps the MongoDB embeddings-collection sync deferred; the JSON sidecar stays canonical"
    date: "2026-08-11"
    summary: "Section 10.1 lists an `embeddings` collection as the eventual canonical MongoDB metadata store synced with FAISS, and RAG-001/ADR-004 deferred that sync 'to RAG-003 (corpus ingestion)'. On implementing RAG-003 the sync was DELIBERATELY kept deferred rather than built: (1) the only planned consumer, the Cinematographer (AI-007), reads the FAISS index directly via VectorIndex.load() — nothing reads the embeddings collection; (2) the Python ai-service has no Mongo client (no pymongo/motor dependency), so a sync would add a new dependency + a WSL2->Windows Mongo connection purely to write rows no code reads; (3) per ADR-004 the JSON sidecar written beside the index is already the canonical, self-contained, unit-testable metadata store. Adding an unread Mongo write would be speculative scaffolding, contrary to the project's honest-scaffolding stance (cf. ADR-014). The sidecar holds Mongo-ready {text, metadata} rows, so adopting the collection later (if prompt-similarity checks in AI-008 or a shared read path actually need it) is a straightforward load, not a re-embed. Revisit when a real reader of the embeddings collection exists."
  - id: "ADR-018"
    title: "Storyboard intent-similarity threshold: 0.35 cosine similarity, max 2 retries"
    date: "2026-08-11"
    summary: "R-12 left the storyboard similarity-check threshold undecided (the spaCy scoring half was already resolved by ADR-010). AI-008 adopts STORYBOARD_SIMILARITY_THRESHOLD=0.35 (env-overridable, config.py) as a documented default absent a specified value — the same pattern ADR-010 used for the spaCy formula. Chosen conservatively low relative to the ~0.7 cosine similarity observed between a real clarified prompt and its real generated storyboard in live verification (WSL2, real Groq + real all-MiniLM-L6-v2 embedder): 0.35 comfortably passes well-aligned storyboards on the first attempt without spurious retries, while still being low enough to catch genuine drift rather than never firing. MAX_STORYBOARD_RETRIES=2 reuses ADR-005's bounded-retry default (same as the critic loop, FR-8). Both values are revisit candidates once the curated 50-prompt evaluation set (EVAL-001) gives a larger sample to calibrate against."
  - id: "ADR-019"
    title: "Concrete Tier 1/2/3 external provider selection (PROVIDER-001)"
    date: "2026-08-11"
    summary: "Tier 1 (free, wired up now, credentials live-validated 2026-08-11): image = Pollinations.ai (no account/key, live-verified via curl) + Cloudflare Workers AI (validated alternate — real account+token confirmed live, real text-to-image catalog of 287 models: FLUX.1/FLUX.2, SDXL, Leonardo Phoenix); video = Hugging Face Inference Providers (the actual pick, not a fallback — token live-verified via whoami, correct inference.serverless.write scope). CORRECTED same day: video was initially assigned to Cloudflare based on secondary research citing 'FLUX 3 Video'/'HappyHorse 1.0' models; once real Cloudflare credentials existed, a direct query against Cloudflare's own live API (task filter, name-substring search, full task-taxonomy enumeration across all 287 models) found NO video-generation model or category at all — that research was wrong, corrected before any BACKEND-005 code was built on it. Tier 2/3 (paid): fal.ai selected as a single pay-as-you-go gateway (one key, many models) but deliberately not wired into any code path yet — the team chose to stay free-only during testing while keeping the Section 6.6 abstraction interface ready for a low-effort later switch. Resolves R-8. See PROJECT_ARCHITECTURE.md Section 12/13 for full detail."

  - id: "ADR-020"
    title: "Rendering pathway/provider is a user choice, not an automated agent decision — Producer/Router (AI-005) retired"
    date: "2026-08-11"
    summary: "The user picks exactly one of remotion/pollinations/cloudflare/huggingface once, before generation, applied uniformly to every shot. AI-005's per-shot LLM classification is removed from the LangGraph graph entirely. Supersedes ADR-013. See PROJECT_ARCHITECTURE.md for full detail."
  - id: "ADR-021"
    title: "Real per-shot generation wired for image providers only; video (Hugging Face) deliberately held; new single-image mode added"
    date: "2026-08-11"
    summary: "Per direct team instruction, real generation is now invoked for pollinations/cloudflare/remotion shots (POST /api/storyboards/:id/generate, generationService.js) while huggingface shots are deliberately NOT attempted (status:on_hold) pending a paid API key — not retried against a known-depleted free quota. A separate, additive single-image mode (POST /api/images) was also added, skipping the storyboard/shot decomposition entirely for a one-image-from-enhanced-prompt flow — does not change what an image-provider storyboard produces. Both live-verified end-to-end (backend + real browser session). See PROJECT_ARCHITECTURE.md for full detail."
  - id: "ADR-022"
    title: "Voice-to-text prompt input via the browser Web Speech API (not a hosted STT backend)"
    date: "2026-08-11"
    summary: "Standing team request (was the sole next_tasks item): a press-to-talk mic on the prompt box that streams transcribed speech into the textarea. Chose the browser-native Web Speech API (SpeechRecognition) over a hosted Groq whisper-large-v3 endpoint, because interimResults streams words live as you speak (a record-then-POST Whisper flow can't) and it honors ADR-015's no-local-heavy-compute rule (Chrome/Edge transcribe on the vendor's cloud — zero PC load, no torch/whisper) at zero backend/key/cost and without touching the Groq free-tier quota. Two layers: frontend/src/hooks/useSpeechRecognition.ts wraps the raw recognizer ({supported,listening,transcript,interim,error,start,stop,reset}); frontend/src/hooks/useDictation.ts binds it to one text field, owning the press-and-hold (walkie-talkie) gesture — hold via pointer capture (setPointerCapture guarded) AND keyboard hold (Space/Enter) for accessibility — and merging recognized speech after existing text (mergeSpoken collapses the seam to one space). frontend/src/components/DictationMic.tsx is a self-contained mic button on that hook (renders nothing when unsupported), used in TWO places: PromptComposer.tsx (mic in the prompt textarea, auto-padded, + pulsing Listening indicator and friendly not-allowed/no-speech/audio-capture error copy) and ClarificationChat.tsx (one mic beside EVERY answer box, so the whole clarify step is voice-capable). Graceful degradation: mic hidden on Firefox/older Safari, typed fields unaffected. Additive team feature outside the 35-task roadmap (like ADR-021's single-image mode) — verified-task count unchanged. useSpeechRecognition.ts is the sole swap seam for a future MediaRecorder->POST /api/transcribe path. Live-verified in the in-app Chromium: composer mic renders as Hold-to-dictate/Hold-to-talk with textarea padding at 56px; demo-mode flow reached ClarificationChat and confirmed exactly one Hold-to-talk mic per answer; pointer AND keyboard hold gestures fired without crashing; the mic-blocked sandbox exercised the not-allowed path for real (friendly error shown, aria-pressed reset to false with no stuck listening state); served module verified clean (no stale symbols), no Vite error overlay; tsc -b + oxlint clean. True streaming needs a real mic (unavailable in the sandbox). See PROJECT_ARCHITECTURE.md ADR-022 for full detail."
  - id: "ADR-023"
    title: "Async generation — one Bull job per storyboard + polling (resolves the ADR-014/ADR-021 synchronous stopgap)"
    date: "2026-08-11"
    summary: "INTEG-001 backend slice. POST /api/storyboards/:id/generate now enqueues ONE Bull job per storyboard on the BACKEND-003 `generation` queue and returns 202 {jobId,storyboardId,status} immediately; the in-process worker (queues/generationQueue.js processGeneration) iterates shots via the unchanged generationService adapters, persists each shot's status/asset_url/error to Mongo incrementally, and reports job.progress() 0-100. New GET /api/jobs/:id returns {jobId,state,progress,storyboardId,failedReason?,shots[]} (state/progress from Bull/Redis, shots from the storyboard doc). New Storyboard.job_id links the most-recent run (in-flight dedup + client reconnect). Decisions: job granularity = per-storyboard (per-shot fan-out deferred to CRITIC-001); job store = Bull/Redis only (Mongo `jobs` collection stays deferred, ADR-017 spirit); progress transport = polling GET /api/jobs/:id (proposal's WebSocket fallback), WebSocket push deferred. A per-shot failure or held huggingface (video) shot is recorded on that shot and the job continues; the job only fails on infra errors. Response changed 200->202 but the frontend never called /generate so no UI breaks. Best-effort (non-atomic) dedup: two truly-concurrent calls could parallel-save the same doc (VersionError) — hardening deferred. Verified via an HTTP integration run (real app+Bull+Redis+Mongo, generation stubbed): 202->active->completed, progress 0/33/67/100, three shot outcomes correct, dedup + 404s — 11/11, deterministic across 3 runs. See PROJECT_ARCHITECTURE.md ADR-023 for full detail."
  - id: "ADR-024"
    title: "EVAL-002 baseline condition scope — enhancement text + spaCy scores now; real media generation deferred"
    date: "2026-08-12"
    summary: "Condition A (ai-service/evaluation/baseline.py generate_baseline()) is ONE complete_json call -- no clarification, no RAG grounding, no multi-shot decomposition, no retry loop -- the structural counterpoint to the multi-agent pipeline. run_baseline.py runs it over all 50 EVAL-001 prompts, paced under Groq's 30 req/min free-tier cap, records original+enhanced FR-1 spaCy scores per prompt (reported only, per ADR-006), isolates per-prompt failures, writes evaluation/results/baseline_results.json. Real media generation and the CLIPScore-style alignment metric are deliberately NOT run in EVAL-002 -- the rendering methodology (which provider, which frame(s), video vs. still) isn't decided yet, and rendering ~50-100 videos before EVAL-004 fixes that risks redoing them; the decision is deferred to EVAL-003/EVAL-004 so it's made once for both conditions. Live-verified: 50/50 prompts succeeded against the real Groq API. Real finding (reportable as-is per FR-12's either-direction acceptance criterion): baseline spaCy overall_score did not improve on average (70.4->69.6; 18 up/4 flat/28 down), mostly via temporal_coherence dropping on longer present-tense text -- a heuristic artifact (ADR-010), not evidence of a worse enhancement, and exactly why ADR-006 excluded spaCy as the study's ground truth. See PROJECT_ARCHITECTURE.md ADR-024 for full detail."

