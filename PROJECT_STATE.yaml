        note: "Single-round design (generate <=2 questions, then one resolve call) — no iteration loop, so termination is structural rather than a retry-count cap. Concrete Groq model (llama-3.3-70b-versatile) selected and confirmed working — see ADR-011. Fallback-provider integration is explicitly out of scope (that's AI-006/PROVIDER-001)."
