        verified_by: "Claude (Opus 4.8) — 46/46 pytest pass (11 new in tests/test_llm.py, providers mocked); live end-to-end from WSL2 (.venv-wsl): (1) real Groq primary via llm.complete_json returned {'city':'Tokyo'}; (2) with the Groq primary forced to raise APIConnectionError, llm.complete_json transparently fell through to the REAL hosted fallback API (second Groq model llama-3.1-8b-instant on the same free key) and returned {'city':'Rome'}, logging the documented fallback warning"
        note: "Fallback lives entirely in the llm/ layer behind the unchanged complete_json(system,user,temperature)->dict contract, so AI-003/004/005 and all their tests are untouched. llm/completion.py tries groq_complete_json (llm/groq_client.py) first and, on a _FALLBACKABLE failure (GroqConfigError | groq.APIError [connection/rate-limit/5xx] | json.JSONDecodeError), calls fallback_complete_json (llm/http_llm_client.py). Per ADR-015 the fallback is a HOSTED OpenAI-compatible /chat/completions endpoint (httpx, no new dep) — NEVER a local model: the user explicitly ruled out on-device LLM/heavy compute (slows the dev machine, hurts UX). An earlier Ollama/local-llama3 implementation was written then removed this same session after a cold-start warm-up took >120s, confirming the concern. Defaults point at a second Groq model on the same GROQ_API_KEY (different per-model rate bucket vs the 30 req/min free-tier cap, zero cost, no extra signup); FALLBACK_LLM_BASE_URL/API_KEY/MODEL override to any independent provider (OpenRouter/Together/Gemini-OpenAI-compat/OpenAI). LLM_FALLBACK_ENABLED=false makes Groq failures fatal (raises LLMError). Non-provider errors (e.g. a caller TypeError) propagate rather than being masked by a fallback. Concrete second Groq provider decision recorded as ADR-016; hosted-only policy as ADR-015."

  - id: "phase_6"
    name: "RAG Knowledge Base & Style Grounding"
    window: "2026-09/2026-11"
    status: "not_started"
    tasks:
      - id: "RAG-002"
        name: "Curate cinematography reference corpus"
        status: "VERIFIED"
        priority: "MEDIUM"
        dependencies: []
        verified_on: "2026-08-10"
        verified_by: "Claude (Opus 4.8) — offline validation via the loader on Windows Python (no torch/faiss needed): 75 items load, all 8 categories present (framing 11 / angle 6 / movement 11 / lens 8 / lighting 14 / color 8 / composition 8 / mood 9 — none thin), all metadata.id unique, every item in the {text, metadata} shape VectorIndex.add() consumes, every item carries >=3 tags, and load_corpus() raises CorpusError on a missing file. Mirrors ai-service/tests/test_corpus.py (7 offline tests, dependency-light — pass under WSL2 pytest too)."
        note: "ai-service/rag/corpus/: cinematography.json (75 curated passages), loader.py (load_corpus() — reads + strictly validates into the VectorIndex item shape; dedups metadata.id; raises CorpusError on malformed/missing input), __init__.py, README.md. LICENSE-CLEAN per the FR-4 security note: every passage is an ORIGINAL summary of common-knowledge film-technique craft written for this project, not copied from any book/article/site. Written with mood-word vocabulary (tense/romantic/epic/eerie...) so shot-description queries retrieve well. Corpus curation ONLY — no embedding, no populated production index (RAG-003), no Cinematographer consumer (AI-007). Per ADR-015 RAG-003 may still embed locally for now (deferred hosted-embeddings migration)."
      - id: "RAG-003"
        name: "Embed corpus, populate vector index"
        status: "VERIFIED"
        priority: "MEDIUM"
        dependencies: ["RAG-001", "RAG-002"]
        verified_on: "2026-08-11"
        verified_by: "Claude (Opus 4.8) — 6/6 new offline pytest tests pass (59/59 total) in ai-service/.venv-wsl with an injected deterministic embedder (ingest->embed->persist->reload contract run against the REAL RAG-002 corpus, so a corpus regression fails the test); live end-to-end in WSL2 with the real all-MiniLM-L6-v2 model: `python -m rag.build_index` embedded all 75 corpus passages into a 384-dim FAISS index (category coverage framing 11 / lighting 14 / movement 11 / mood 9 / lens 8 / color 8 / composition 8 / angle 6), persisted rag/data/style_index.{faiss,meta.json}, then a fresh VectorIndex.load() reloaded 75 vectors and ranked three real semantic queries sensibly (tense/dark/threatening -> Silhouette 0.533 / Horror atmosphere 0.530; epic aerial vista -> Epic look 0.639 / Aerial-drone 0.615; intimate face -> Close-up 0.594 / Medium close-up 0.570)"
        note: "ai-service/rag/build_index.py: build_index(path, embed_fn=None, files=None, dim) loads the curated corpus (RAG-002 load_corpus()), embeds via the real all-MiniLM-L6-v2 encoder (RAG-001), and saves the populated FAISS index + JSON metadata sidecar to VECTOR_INDEX_PATH; a `python -m rag.build_index` CLI prints a per-category summary. Idempotent: a run rebuilds the whole index from the committed corpus (the single source of truth); the generated rag/data/ index is a gitignored, disposable derived artifact (confirmed via git check-ignore — not committed). embed_fn is injectable so tests build a real persisted index offline. AI-007 consumes this via VectorIndex.load(). SCOPE: MongoDB embeddings-collection sync (Section 10.1) is DEFERRED per ADR-017 — the JSON sidecar remains the ADR-004 canonical metadata store; the sole consumer (AI-007) reads FAISS directly and the Python ai-service has no Mongo client, so a speculative Mongo write with no reader was not added."
      - id: "AI-007"
        name: "Cinematographer agent (RAG-grounded)"
        status: "VERIFIED"
        priority: "MEDIUM"
        dependencies: ["AI-004", "RAG-003"]
        verified_on: "2026-08-11"
        verified_by: "Claude (Opus 4.8) — 7/7 new offline pytest tests pass (66/66 total) in ai-service/.venv-wsl with a deterministic injected embedder + mocked LLM (empty-shots no-op, empty-index pass-through with zero LLM calls, camera grounding + style-token collection across two shots, existing-token merge/dedup, malformed-output rejection, plus two full-graph tests — one confirming the empty-index pass-through path, one confirming grounding flows end-to-end through generate_storyboard); live end-to-end in WSL2 against the real Groq API and the real persisted RAG-003 index (rag/data/style_index): a film-noir detective prompt produced per-shot camera directions and world_state.style_tokens built from exact corpus technique vocabulary (Dutch angle, Low-key lighting, Handheld shot, Extreme close-up), cross-checked against rag/corpus/cinematography.json's technique names to confirm genuine retrieval grounding rather than LLM hallucination"
        note: "ai-service/orchestrator/agents/cinematographer.py: refine_cinematography(shots, world_state, index=None) is the third LangGraph node (screenwriter -> cinematographer -> producer -> END, matching the ordering ADR-012 documents). Per shot: builds a retrieval query from description+camera+setting, calls VectorIndex.search() (index defaults to the lazily-loaded persisted RAG-003 index via a module-level `_load_production_index` indirection point, injectable in tests like the rest of rag/), feeds retrieved {id, technique, text} passages to the LLM as grounding-only context, and applies the LLM's refined `camera` + style keywords (merged into world_state.style_tokens, case-insensitive deduped, order-preserving). CinematographerOutputError on malformed LLM output. Graceful degrade: no shots or an empty/unbuilt index short-circuits to a pass-through with zero LLM calls, matching the rest of the RAG stack's empty-index philosophy. Placed BEFORE Producer/Router in the graph (not after) so pathway routing can see the grounded style_tokens (e.g. a photorealism signal could influence the ADR-013 heuristic), per ADR-012's explicit ordering. Does not add new fields to the shot shape — only refines `camera` and populates the existing `world_state.style_tokens` — so remotion/src/types.ts, frontend/src/lib/types.ts, and backend/src/models/Storyboard.js all stay compatible with no changes needed."
      - id: "AI-008"
        name: "Sentence-similarity intent check + retry loop"
        status: "VERIFIED"
        priority: "MEDIUM"
        dependencies: ["AI-007"]
        verified_on: "2026-08-11"
        verified_by: "Claude (Sonnet 5) — 5 new offline pytest tests pass (71/71 total) in ai-service/.venv-wsl: compute_similarity's empty-shots and matching-vs-drifted-text cases (deterministic 2-axis fake embedder), plus 3 full-graph tests (pass on first try / retry once then pass / exhaust all retries then finalize) with a canned similarity-score queue and a call-counting screenwriter wrapper. Live end-to-end in WSL2 against the real Groq API and the real all-MiniLM-L6-v2 embedder: (1) default threshold (0.35) on a real prompt passed on the first attempt, real similarity score ~0.7, storyboard rendered with 4 shots all routed by the real Producer; (2) STORYBOARD_SIMILARITY_THRESHOLD forced to an impossible 1.5 to exercise the ceiling — logs show attempt 1/3 (score 0.743) -> retry, attempt 2/3 (score 0.707) -> retry, attempt 3/3 (score 0.699) -> finalizes with the last attempt rather than hanging, confirming the bounded loop actually terminates."
        note: "ai-service/orchestrator/similarity.py: compute_similarity(clarified_prompt, shots, embed_fn=embed) reuses RAG-001's all-MiniLM-L6-v2 encoder (rag/embedder.py) rather than a second embedding pathway -- joins shot descriptions into one storyboard-level string and returns its cosine similarity (dot product of L2-normalized vectors) against the clarified prompt. orchestrator/graph.py adds a 4th node, `intent_check`, between cinematographer and producer (matching the Section 4.4 diagram's SIM-check placement, right after Cinematographer/RAG grounding and before Producer/Router), plus a conditional edge (`_route_after_intent_check`) that routes back to `screenwriter` when the score is below threshold and attempts remain, or forward to `producer` otherwise. Retry accounting is tracked via a new `attempt_count` state field incremented by the Screenwriter node itself (not re-derived inside the router from a value it doesn't fully control) -- this replaced an initial off-by-one design (a `retry_count` incremented and read back within the same intent_check node) caught by the test `test_generate_storyboard_finalizes_after_max_retries`, which asserted 3 total screenwriter calls but got 2; the fix moves the counter to the node that actually performs the retried work. ADR-018 records the threshold value decision (STORYBOARD_SIMILARITY_THRESHOLD=0.35, MAX_STORYBOARD_RETRIES=2, both env-overridable in config.py) resolving the remainder of R-12. On retry exhaustion the last attempt is finalized rather than failing the request, mirroring FR-8's critic-loop behavior. Per ADR-015, this reuses the already-local RAG embedder rather than adding a hosted embeddings call -- consistent with the existing deferred-migration stance. Completes the RAG-001..003 + AI-007 + AI-008 orchestrator vertical; only PROVIDER-001/BACKEND-005/CRITIC-001 (external-API pathway) and INTEG-001/002 remain to reach a full end-to-end pipeline."

