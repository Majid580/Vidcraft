        note: "Both the backend (ADR-023) and frontend async-generation slices, previously verified only in isolation (a stubbed HTTP integration test; a demo-mode browser run), are now confirmed to actually connect end-to-end against the real stack — the explicit remaining closeout item from the prior two sessions. One real issue surfaced during this run, recorded and then corrected same session: POST /api/prompts / POST /api/storyboards each fired twice, initially suspected as a StrictMode-wrapped-app frontend bug (see PROJECT_ARCHITECTURE.md R-14) but actually caused by a team member concurrently using the same dev frontend while this confirmation run was in progress — two independent real clients, not one click double-firing. The resulting race (two storyboard docs, one Mongoose VersionError [500] on the losing /generate call, the other self-healed with the correct UI result and no visible error) is still a real dedup-atomicity gap worth hardening, just not a client-side defect. Did not block VERIFIED status. Still open, non-blocking: hardening /:id/generate's dedup for genuine concurrent requests (R-14); making POST /api/storyboards (creation) itself async; optional WebSocket progress push (polling proven sufficient). Mongo `jobs` collection stays deferred (Bull/Redis is the job store, ADR-023)."
