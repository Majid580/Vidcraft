decisions:
  - id: "ADR-001"
    title: "LangGraph for multi-agent orchestration"
    date: "2026-08-10"
    summary: "Chosen over a hand-rolled if/else pipeline for explicit, inspectable control flow and bounded retry cycles."
  - id: "ADR-002"
    title: "Groq as primary LLM, secondary provider as fallback only"
    date: "2026-08-10"
    summary: "Minimizes compounding latency across multiple sequential agent calls per generation."
  - id: "ADR-003"
    title: "Dual-mode generation: Remotion (guaranteed) + tiered external APIs (best-effort)"
    date: "2026-08-10"
    summary: "Keeps the system demonstrable at zero cost; avoids an unsupportable guaranteed-consistency claim on the API pathway."
  - id: "ADR-004"
    title: "FAISS + MongoDB metadata instead of a managed vector database"
    date: "2026-08-10"
    summary: "Simplicity; avoids adding another managed/paid dependency."
  - id: "ADR-005"
    title: "Bounded retry loops everywhere (default max 2)"
    date: "2026-08-10"
    summary: "Predictable cost and demo timing; never unbounded self-refinement."
  - id: "ADR-006"
    title: "Evaluation study uses an independent metric, not the triggering spaCy heuristic"
    date: "2026-08-10"
    summary: "Avoids circularity between the enhancement trigger and the evaluation metric."
  - id: "ADR-007"
    title: "Scope deliberately trimmed (single TTS provider, small tiered API set)"
    date: "2026-08-10"
    summary: "Keeps the project achievable for a 4-person team within the timeline."
  - id: "ADR-008"
    title: "ai-service runs inside WSL2 (Ubuntu), not native Windows Python"
    date: "2026-08-10"
    summary: "Resolves BLOCK-001 (spaCy blocked by Windows Smart App Control) without disabling a system security feature."
  - id: "ADR-009"
    title: "Remotion lives in a dedicated top-level remotion/ directory, not inside ai-service/"
    date: "2026-08-10"
    summary: "Remotion is a Node/React toolkit; keeps it isolated from the Python ai-service, mirroring frontend/backend separation."
  - id: "ADR-010"
    title: "FR-1 scoring formula: equal-weight average, 40-point flag threshold"
    date: "2026-08-10"
    summary: "overall_score is the unweighted mean of the 5 dimension scores; any dimension below 40/100 raises its corresponding flag+suggestion. Simplest defensible default absent a specified formula (R-12); documented here rather than left as a silent hard-coded choice. Per-dimension heuristics (subject-clarity from nsubj/nsubjpass presence, action-specificity from a vague-verb lemma list, environment-detail from GPE/LOC/FAC NER + locative prepositions + time-of-day words, visual-richness from adjective density, temporal-coherence from temporal-marker presence + finite-tense mixing) live as inline comments in ai-service/analyzer/scoring.py. Revisit if the curated 50-prompt test set (EVAL-001) shows systematic miscalibration."
  - id: "ADR-011"
    title: "Concrete Groq model selected: llama-3.3-70b-versatile"
    date: "2026-08-10"
    summary: "Section 11.2 left the specific Groq model TBD. Queried the live Groq /models endpoint, selected llama-3.3-70b-versatile as the GROQ_MODEL default (env-overridable), confirmed via a live JSON-mode structured-output smoke test. Chosen over llama-3.1-8b-instant for stronger structured-reasoning quality on the orchestrator agents' tasks. The fallback-provider choice was later resolved by ADR-015 (hosted-only, never local) + ADR-016 (default = second Groq model llama-3.1-8b-instant)."
  - id: "ADR-012"
    title: "Screenwriter drafts full shot shape (camera + pathway placeholder), not just narrative fields"
    date: "2026-08-10"
    summary: "AI-004's Screenwriter agent drafts a best-effort camera value per shot and hardcodes pathway to 'remotion', both explicitly documented as placeholders for Producer/Router (AI-005) and Cinematographer (AI-007) to overwrite — lets the storyboard already flow into REMOTION-003 today instead of sitting unusable until those agents exist."
  - id: "ADR-013"
    title: "Producer/Router pathway heuristic: photorealism signal maps to external_api, else remotion"
    date: "2026-08-10"
    summary: "AI-005's Producer/Router agent sends each shot + world_state to Groq and asks whether the shot's description/style_tokens explicitly call for photorealistic/live-action output; if so, pathway=external_api, else remotion. Live-verified: a mixed prompt correctly split 1 external_api / 2 remotion. external_api-routed shots can't actually be rendered yet — BACKEND-005 (adapter layer) and PROVIDER-001 (concrete providers) don't exist yet; this is forward-looking routing only."

  - id: "ADR-014"
    title: "POST /api/storyboards is synchronous (201/completed), not the PROPOSED async 202/processing shape"
    date: "2026-08-10"
    summary: "PROJECT_ARCHITECTURE.md Section 9.2 proposed POST /api/storyboards return 202 {storyboardId, status: 'processing'} for an async job. BACKEND-004 implements it as a synchronous call instead — it awaits ai-service's /storyboard/generate directly and returns 201 with the completed storyboard — because BACKEND-003 (the Bull.js queue) doesn't exist yet, and faking a 'processing' status for a call that's actually already finished would be misleading rather than honest scaffolding. Revisit once BACKEND-003 lands: the route should move the ai-service call into a queued job and genuinely return 202/processing, with GET /api/storyboards/:id reporting real progress."
  - id: "ADR-015"
    title: "No local LLM / heavy on-device compute — all inference goes through hosted APIs"
    date: "2026-08-10"
    summary: "The user directed that no LLM or heavy work run locally: on-device inference consumes dev-machine resources and gives slow responses, degrading UX. AI-006's fallback was therefore implemented as a hosted OpenAI-compatible /chat/completions endpoint, not the initially-drafted local Ollama/llama3 provider (which was removed the same session after a cold-start warm-up exceeded 120s, confirming the concern). Forward implication: RAG embedding (RAG-001's local sentence-transformers+torch) and AI-008's similarity check should migrate to a hosted embeddings API under this policy — logged as an open follow-up on RAG-003."
  - id: "ADR-016"
    title: "Fallback LLM default: a second Groq model via the OpenAI-compatible endpoint"
    date: "2026-08-10"
    summary: "Section 13/.env.example left FALLBACK_LLM_PROVIDER TBD. AI-006 defaults it to a second Groq model (llama-3.1-8b-instant) reached through Groq's OpenAI-compatible base (https://api.groq.com/openai/v1) on the same free GROQ_API_KEY — zero cost, no extra signup, and a different per-model rate bucket than the primary llama-3.3-70b (directly mitigating the 30 req/min free-tier 429s). The client is provider-agnostic: FALLBACK_LLM_BASE_URL/API_KEY/MODEL override to any independent OpenAI-compatible host (OpenRouter, Together, Google Gemini's OpenAI-compat endpoint, OpenAI) with no code change. Caveat: a same-provider fallback does not cover a full Groq outage — revisit if an independent secondary is warranted (relates to R-8/R-13)."

