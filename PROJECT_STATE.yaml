WebVTT caption track, and a hardsubbed copy, wired into generationQueue.js after a successful assembly, persisted as Storyboard.thumbnail_url/subtitles_url/subtitled_video_url/postprocess_error, surfaced on GET /api/jobs/:id, and consumed by the UI (<video poster>, a native <track> for browser-toggleable captions, and a second 'With captions' download). Four design decisions recorded in ADR-028, each avoiding a silent-wrongness failure: WebVTT is the ONLY subtitle format written (the one format <track> can display and libass can burn, so there are never two files to disagree); the hardsub is a SEPARATE file so the clean master survives for download and for frame-level evaluation metrics that burned-in text would corrupt; captions are built from a newly-exported remotionService.assembledShots() — the same filter the renderer uses, extracted specifically so a second copy cannot drift — and are REFUSED outright if the derived frame total disagrees with the durationInFrames Remotion reported, because drifting captions look correct until someone watches to the end; and the poster is sampled from the first ASSEMBLED shot's midpoint rather than the whole video's, which would land on an arbitrary later close-up. Live-verified end-to-end with no stubs (real Express, real Bull on real Redis, real MongoDB, real Pollinations, real Remotion, real FFmpeg): 202 -> polled to completion, all three artifacts produced with postprocess_error unset and refetched over real HTTP (text/vtt; charset=utf-8 confirmed). The run exercised the hardest case by luck — shot 1 died on a real transient Pollinations 500 — and the captions correctly described the ASSEMBLED 180-frame timeline (2 cues, starting at 00:00:00.000 with shot 2) rather than the authored 300-frame one, with ffprobe agreeing exactly. Burn-in confirmed by extracting real frames at four timestamps across two storyboards; the poster confirmed clean of burned text; and a real Chromium against the real /media mount confirmed the browser parses the track (readyState 2 LOADED, mode 'showing', cues at exactly 0-3s/3-6s, correct activeCue at t=4.0, poster 640x360). 13/13 offline edge checks passed via a temporary harness (deleted after use, per project convention — the backend has no test framework). tsc -b and oxlint clean. INTEG-002 moves IN_PROGRESS -> VERIFIED; completion 30/36 -> 31/36 (86.1%). ONE ENVIRONMENT DEFECT FOUND, NOT FIXED (needs sudo, so left to the team): the WSL2 Redis service binds 127.0.0.1 inside WSL and is unreachable from Windows, so the committed REDIS_URL=redis://localhost:6379 makes every POST /:id/generate return 500 — worked around this session with a second Redis on port 6380 bound to 0.0.0.0, then backend/.env was restored to its committed value. Also added a 'backend' entry to .claude/launch.json so the API server can be started through the managed runner. Prior update, retained below: Claude (Opus 5) — FR-7 continuity injection + FR-9 assembly (ADR-027), from two team-reported defects. Diagnosed both to one root cause: the pipeline's two halves were never connected — remotion/src/ had no <Img> element at all (so Remotion rendered only its own caption text), and generationService.generateShotAsset() took worldState as its third parameter and never used it on the API pathway (so every shot was an independent draw and AI-007's RAG-grounded style_tokens were computed, persisted, then discarded unread). Built backend/src/services/continuityPrompt.js (invariant Subject/Location/Style block byte-identical across shots, deterministic per-shot seed, reference-image anchoring through the previously-unread world_state.reference_image_url); widened externalApiService/pollinationsImage/cloudflareImage to carry seed/negativePrompt/referenceImageB64/strength; made the Remotion compositions image-first via components/ShotLayer.tsx (old motion-graphics card kept as the no-image fallback); added StoryboardVideo/render-storyboard.mjs/remotionService.renderStoryboard() and wired assembly into generationQueue.js with Storyboard.video_url/video_error; extracted remotion/src/shotTaxonomy.mjs so Node and the browser bundle share one copy. Corrected two of my own design choices after looking at real generated output: a shared storyboard-wide seed pins the composition (not just the palette) and made a wide/medium/close-up all return the same portrait — now per-shot; and framing/action had to move to the FRONT of the prompt, with terse camera strings expanded into descriptive framing phrases and motion words routed to the Remotion camera move instead. Live-verified with 3 real Pollinations generations + a real Remotion render, no stubs: same subject/location/palette, framing varying wide -> medium -> close, one 1920x1080 H.264 MP4 of exactly 300 frames (4+3+3s at 30fps), no text cards. Three real defects found and fixed en route: helmet Cross-Origin-Resource-Policy blocked the headless browser from loading /media stills (A RUNNING BACKEND MUST BE RESTARTED to pick this up); render-shot.mjs ran main() at import; the taxonomy was unreachable from the browser bundle. NOT verified: the Cloudflare img2img reference-anchoring tier. Known residual drift (consistent with FR-7's best-effort scope): garment colour can shift between shots, and extreme close-ups on an object still render as tight portraits (the Remotion punch-in compensates). INTEG-002 moved NOT_STARTED -> IN_PROGRESS; completion unchanged at 30/36 (83.3%). Closed R-10 structurally. Also corrected two drifted component entries in this file (Critic still read NOT_IMPLEMENTED while CRITIC-001 was recorded VERIFIED; External API Integration Layer still said generation was synchronous). Prior update, retained below: Claude (Sonnet 5) — CRITIC-001, vision-model critic loop (FR-8). Per direct user instruction, held BACKEND-005 (no video-generation API access) and EVAL-004 (Groq daily quota exhausted, blocks on EVAL-003) and moved to CRITIC-001 instead. Resolved two proposal TBDs by checking live rather than assuming (ADR-026): (1) vision provider — Groq's live /models catalog has zero vision-capable models, so picked Cloudflare Workers AI's @cf/meta/llama-4-scout-17b-16e-instruct (already-validated PROVIDER-001 credentials, no new signup) after a first candidate (llama-3.2-11b-vision-instruct) turned out gated behind a Community License needing manual dashboard acceptance — skipped rather than accepted on the user's behalf; live-verified against both a genuinely matching and mismatching real image before writing any code against it. (2) pathway scope — live verification revealed Remotion's guaranteed pathway renders a stylized placeholder (near-black theme background + late-fading text caption), not a literal scene depiction, so a literal vision-vs-text critic would fail every Remotion shot by design; scoped the critic to pathway === 'external_api' shots only, Remotion shots skip the loop. Built ai-service/critic/vision_client.py (evaluate_frame, new POST /critic/evaluate route) and backend/src/services/criticService.js (runCriticLoop — pathway filter, ffmpeg frame extraction, bounded regenerate-then-reevaluate loop), wired into generationQueue.js; reused the shot schema's previously-unused retry_count field, added critic_passed/critic_reason. A critic-loop infrastructure failure is caught separately so it can't drag a successful generation down to 'failed'. 7 new offline pytest tests pass (ai-service/tests/test_critic.py); full suite re-run, 98/98, zero regressions. Live-verified end-to-end against the real stack (real Express, Bull/Redis, MongoDB, ai-service, Cloudflare vision model, Pollinations image gen, Remotion render — no stubs) via temporary harnesses (backend/_critic_verify*.js, deleted after use): a real Pollinations image correctly passed critique; a paired Remotion shot correctly skipped the loop; a deliberately adversarial description produced two genuine critic fails, retry_count reaching CRITIC_MAX_RETRIES (2), shot finalized 'completed' with the last verdict — a real demonstrated automatic retry cycle on the shipped code path, meeting FR-8's completion criterion. Added CLOUDFLARE_ACCOUNT_ID/CLOUDFLARE_API_TOKEN/CRITIC_VISION_MODEL to .env.example's AI-microservice section; ai-service now holds its own copy of the Cloudflare credentials (mirrors GROQ_API_KEY). Marked CRITIC-001 VERIFIED in this file and PROJECT_PROGRESS.md; completion moves to 30/36 (83.3%). Updated next_tasks — with CRITIC-001 done and BACKEND-005/EVAL-004 deliberately held per instruction, next step needs a team call. Prior update, retained below: Claude (Sonnet 5) — R-14 hardening: fixed the /:id/generate dedup race (PROJECT_ARCHITECTURE.md Section 24). Two genuinely concurrent POST /api/storyboards/:id/generate calls on the same storyboard used to have their 'fresh run' write both reach doc.save(), and the loser threw a raw Mongoose VersionError (500) — the root cause behind the collision observed during the INTEG-001 confirmation run. Fix: backend/src/routes/storyboards.js's fresh-run path now goes through Storyboard.collection.findOneAndUpdate (the native MongoDB driver) doing a compare-and-swap on the job_id value read at the top of the handler, instead of Mongoose's doc.save()/Model.findOneAndUpdate — both of which turned out to add an implicit version-key guard on top of any update touching an array via positional operators ($[]), which fights a hand-rolled CAS rather than composing with it (confirmed by reproducing a VersionError through Model.findOneAndUpdate directly before switching to the native collection). The request that loses the CAS now discards its now-redundant Bull job and hands back the winner's job_id instead of erroring. Verified live against the real stack (real Express app, real Bull/Redis, real MongoDB, no stubs) via a temporary harness (backend/_r14_verify*.js, deleted after use): 5 genuinely concurrent /generate calls on one storyboard all returned 202 with the identical jobId, zero 500s, exactly one job_id persisted — repeated 3x, no flakiness. Separately confirmed no regression in the pre-existing sequential behavior: an immediate re-call while a job is still active still dedups to the same jobId, and calling /generate again after the job completes correctly starts a new job (regenerate). R-14 marked Resolved in PROJECT_ARCHITECTURE.md Section 24. Not a Section 20 roadmap task, so completion percentage stays 29/36 (80.6%) — this closes a risk-register item, not a task. Prior update, retained below: Claude (Sonnet 5) — EVAL-003 (partial, IN_PROGRESS, deliberately not being completed further per direct user instruction): built and ran the multi-agent condition (FR-12 Condition B). ai-service/evaluation/multiagent.py's generate_multiagent(prompt) calls the production orchestrator.graph.build_graph() directly with the raw prompt as clarified_prompt (no AI-003 clarification round-trip, mirroring Condition A's design per ADR-025 -- keeps the study's independent variable clean) and surfaces attempt_count/similarity_score as diagnostics. run_multiagent.py mirrors run_baseline.py's shape (paced, per-prompt failure isolation, one results JSON) plus a new --resume flag. 6 new offline pytest tests pass; full suite re-run afterward, 91/91 total, zero regressions. Live end-to-end in WSL2 against the real Groq API + real RAG-003 index: 27/50 prompts succeeded (all first-attempt passes, similarity_score 0.475-0.926, well above the 0.35 threshold) before hitting a REAL Groq per-model daily token cap discovered this session -- llama-3.3-70b-versatile's actual free-tier budget is ~100,000 tokens/day, not the 1,000,000/day previously recorded in memory/groq_free_tier_limits.md (now corrected), and the same-account fallback model was exhausted too, so there was no same-day recovery path. Results (27 ok + 23 error, real 429s) persisted to evaluation/results/multiagent_results.json. Initially set up a Windows Task Scheduler entry to auto-run `--resume` once Groq's daily quota reset (next UTC day); the user then directed dropping that plan entirely -- the 23 failures have one understood, non-code cause (Groq's real daily quota) and would very likely pass on retry, so waiting on/pursuing completion right now wasn't worth it. The scheduled task was cancelled and its helper script deleted; `--resume` remains available to run manually later if the team wants the full 50. EVAL-003 marked IN_PROGRESS, not VERIFIED -- a deliberate stop (same pattern as BACKEND-005's video-tier hold, ADR-021), not an active blocker. Real finding from the 27 completed, reportable as-is: spaCy overall_score dropped even more than EVAL-002's baseline did (69.3 -> 54.3, 26/27 worse) -- very likely a heuristic artifact of joining short per-shot descriptions (choppier than one flowing paragraph) rather than a genuine quality gap, reinforcing ADR-006's spaCy-is-not-ground-truth stance ahead of EVAL-004's CLIPScore metric. Wrote ADR-025 recording both the clarification-skip design decision and the quota-interruption/resume plan. Completion percentage unchanged at 29/36 (80.6%) since EVAL-003 isn't VERIFIED yet. Prior update, retained below: Claude (Sonnet 5) — EVAL-002: ran the single-shot baseline condition (FR-12 Condition A) across all 50 EVAL-001 prompts. ai-service/evaluation/baseline.py's generate_baseline(prompt) is one complete_json call with no clarification round-trip, no RAG grounding, no multi-shot decomposition, no retry loop -- the direct structural counterpoint to the AI-004/007/008 multi-agent pipeline (ADR-024 records the scope decision). ai-service/evaluation/run_baseline.py's run(prompts) drives it over the fixed EVAL-001 set, paced at 2.5s/call to stay under Groq's free-tier 30 req/min cap, records both original- and enhanced-text FR-1 spaCy scores per prompt (reported, not the study's ground-truth metric per ADR-006), isolates any single prompt's failure rather than aborting the run, and writes evaluation/results/baseline_results.json. 8 new offline pytest tests pass 