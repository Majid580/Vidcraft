  - id: "R-11"
    question: "What is the shot-to-Remotion-composition mapping strategy for arbitrary shot descriptions?"
    blocks: ["REMOTION-003"]
  - id: "R-12"
    question: "Exact numeric values: storyboard similarity threshold, spaCy scoring formula/weights"
    blocks: ["AI-002", "AI-008"]
  - id: "R-13"
    question: "Fail-closed behavior when all LLM fallbacks or all API tiers fail"
    blocks: ["error handling in INTEG-001"]
